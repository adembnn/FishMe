<style>
body{margin:0}
.p40-w{position:absolute;border-radius:22px;overflow:hidden;background:#fff;color:var(--encre)}
.p40-ic{position:absolute;width:60px;display:flex;flex-direction:column;align-items:center;gap:6px}
.p40-ic i{display:block;width:60px;height:60px;border-radius:13.4px;background:var(--p40-ph)}
.p40-ic b{display:block;width:36px;height:6px;border-radius:3px;background:var(--p40-lb)}
.p40-ic em{font-style:normal;font-size:11px;font-weight:800;line-height:1;color:var(--p40-tx)}
.p40-dots{position:absolute;left:0;right:0;top:712px;display:flex;justify-content:center;gap:10px}
.p40-dots i{width:7px;height:7px;border-radius:4px;background:var(--p40-dot)}
.p40-dots i.on{background:var(--p40-tx)}
.p40-dock{position:absolute;left:14px;right:14px;bottom:20px;height:92px;border-radius:34px;background:var(--p40-dk);display:flex;justify-content:space-around;align-items:center;padding:0 10px}
.p40-dock i{display:block;width:60px;height:60px;border-radius:13.4px;background:var(--p40-ph2)}
.p40-n{font-variant-numeric:tabular-nums}
.p40c-eau{position:absolute;inset:0;overflow:hidden;background:linear-gradient(180deg,#216E99 0%,#16557F 24%,#0A335E 56%,#06214A 80%,#030F26 100%)}
.p40c-vig{position:absolute;inset:0;background:radial-gradient(ellipse 80% 72% at 50% 44%,transparent 42%,rgba(2,10,28,.5) 100%)}
.p40c-caus{position:absolute;left:-6%;top:-4%;width:112%;height:108%;-webkit-mask-image:linear-gradient(180deg,#000 0,rgba(0,0,0,.8) 40%,transparent 82%);mask-image:linear-gradient(180deg,#000 0,rgba(0,0,0,.8) 40%,transparent 82%)}
.p40c-caus rect{opacity:.34}
.p40c-ray{position:absolute;top:-10%;height:80%;background:linear-gradient(180deg,rgba(170,225,255,.30),rgba(170,225,255,0) 85%);transform:skewX(-18deg);filter:blur(7px)}
.p40c-f{position:absolute;display:block;filter:drop-shadow(-4px 6px 5px rgba(0,0,0,.35))}
.p40c-f img{width:100%;display:block}
.p40c-leg{position:absolute;left:0;right:0;top:455px;text-align:center;font-size:13px;color:var(--encre-douce)}
.p40c-sheet{position:absolute;left:0;right:0;top:498px;bottom:0;background:#fff;border-radius:32px 32px 0 0;box-shadow:0 -10px 30px -12px rgba(14,26,38,.35);padding:8px 16px 0}
.p40c-hd{display:flex;align-items:center;justify-content:space-between;height:40px}
.ecran button.p40c-ok{border:0;background:transparent;font:inherit;font-size:17px;font-weight:800;color:var(--marine);padding:0;height:44px}
.p40c-row{display:flex;align-items:center;justify-content:space-between;margin-top:6px;height:30px}
.p40c-pts{display:flex;gap:6px;align-items:center}
.p40c-pts i{width:10px;height:10px;border-radius:50%;background:var(--filet)}
.p40c-pts i.on{background:var(--marine)}
.p40c-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.ecran button.p40c-t{position:relative;height:72px;border-radius:16px;background:var(--tuile);display:grid;place-items:center}
.p40c-t img{width:62px;display:block}
.p40c-t.on{box-shadow:inset 0 0 0 2.5px var(--marine)}
.p40c-t b{position:absolute;right:5px;top:5px;width:20px;height:20px;border-radius:50%;background:var(--marine);color:#fff;display:grid;place-items:center}
.p40c-seg{display:flex;align-items:center;justify-content:space-between;margin-top:12px;height:44px}
.p40c-sg{display:flex;background:var(--tuile);border-radius:999px;padding:3px;gap:2px}
.p40c-sg span{display:flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:999px;font-size:15px;color:var(--encre-douce)}
.p40c-sg span.on{background:#fff;color:var(--encre);box-shadow:0 1px 3px rgba(14,26,38,.18)}
.p40c-pro{font-size:11px;font-weight:900;color:var(--marine);background:rgba(13,74,133,.12);border-radius:6px;padding:2px 6px;line-height:1.2}

</style>
