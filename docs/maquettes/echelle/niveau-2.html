<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=393, initial-scale=1, viewport-fit=cover">
<title>Niveau 2 · Révélation de la prise</title>
<style>
@font-face{font-family:Nunito;font-weight:700;src:url(fonts/nunito-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:Nunito;font-weight:800;src:url(fonts/nunito-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:Nunito;font-weight:900;src:url(fonts/nunito-latin-900-normal.woff2) format('woff2')}
:root{--navy:#06384D;--deep:#083E58;--green:#157A4E;--pop:cubic-bezier(.34,1.56,.64,1);--f:Nunito,system-ui,sans-serif;--sb:#06384D}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#d9dedf}
body{display:flex;justify-content:center;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:3px solid #0b57d0;outline-offset:3px}
.screen{position:relative;width:393px;height:852px;overflow:hidden}
.island{position:absolute;top:11px;left:50%;width:124px;height:36px;margin-left:-62px;background:#000;border-radius:20px;z-index:40}
.status{position:absolute;top:0;left:0;right:0;height:54px;z-index:30;display:flex;justify-content:space-between;align-items:center;padding:8px 32px 0 50px;font:600 17px/1 -apple-system,"SF Pro Text",system-ui,sans-serif;color:var(--sb,#111)}
.status .ic{display:flex;gap:6px;align-items:center}
.home{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--sb,#111);z-index:40}
.glass{background:linear-gradient(160deg,rgba(255,255,255,.62),rgba(255,255,255,.2));-webkit-backdrop-filter:blur(20px) saturate(1.9);backdrop-filter:blur(20px) saturate(1.9);border:1px solid rgba(255,255,255,.65);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 -1px 1px rgba(255,255,255,.35),inset 0 0 14px rgba(255,255,255,.25),0 10px 28px rgba(10,40,50,.2)}

.screen{background:linear-gradient(180deg,#B4E8F3 0,#6ECBE0 34%,#2E9CC4 70%,#17719B 100%);font-family:var(--f);color:var(--navy)}
.rays{position:absolute;inset:-60px -100px auto -100px;height:520px;background:repeating-conic-gradient(from 180deg at 50% 0,rgba(255,255,255,.22) 0 7deg,transparent 7deg 18deg);-webkit-mask:linear-gradient(#000,transparent 85%);mask:linear-gradient(#000,transparent 85%)}
.bub i{position:absolute;border-radius:50%;background:radial-gradient(circle at 32% 30%,#fff,rgba(255,255,255,.35) 55%,rgba(255,255,255,.1));animation:float 6s linear infinite both;opacity:0}
@keyframes float{0%{opacity:0;transform:translateY(40px)}15%{opacity:.8}100%{opacity:0;transform:translateY(-120px)}}
.top{position:absolute;top:56px;left:0;right:0;text-align:center;font:900 20px/1.1 var(--f)}
.top small{display:block;font:700 14px var(--f);margin-top:3px;color:#0A4A66}
.x{position:absolute;top:56px;left:16px;width:44px;height:44px;border-radius:22px;display:grid;place-items:center;color:var(--navy);z-index:5}
.card{position:absolute;top:116px;left:20px;width:353px;height:466px;border-radius:34px;background:#F6FDFF;box-shadow:0 22px 40px -12px rgba(5,50,80,.5),0 0 0 4px rgba(255,255,255,.55);animation:cardin .7s var(--pop) both}
.art{position:absolute;left:8px;right:8px;top:8px;height:262px;border-radius:28px;overflow:hidden;background:radial-gradient(90% 80% at 50% 62%,#E5FAFF 0,#8FDAEA 52%,#43B3D3 100%)}
.cp{position:absolute;top:12px;left:0;right:0;text-align:center;font:900 52px/1 var(--f);letter-spacing:-1px;color:var(--navy)}
.cp small{font:900 20px var(--f);margin-left:3px}
.cp span{display:block;font:800 13px var(--f);letter-spacing:.8px;color:#0A4A66;margin-top:2px;text-transform:uppercase}
.ripple{position:absolute;left:50%;top:62%;width:60px;height:24px;margin:-12px 0 0 -30px;border-radius:50%;border:2px solid rgba(255,255,255,.9);opacity:0;animation:rip 1.4s .3s ease-out both}
.ripple.b{animation-delay:.6s}
@keyframes rip{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(7)}}
.shadow{position:absolute;left:50%;bottom:30px;width:240px;height:22px;margin-left:-120px;border-radius:50%;background:radial-gradient(#0A5A80aa,transparent 70%);animation:fin .6s 1s both}
.fish{position:absolute;left:24px;top:112px;width:286px;transform:rotate(-5deg);filter:drop-shadow(0 0 14px rgba(255,255,255,.95)) drop-shadow(0 12px 10px rgba(5,60,90,.45));animation:jump 1.2s .45s var(--pop) both}
@keyframes jump{0%{opacity:0;transform:translateY(90px) rotate(-18deg) scale(.55)}55%{opacity:1}100%{transform:translateY(0) rotate(-5deg) scale(1)}}
.row1{position:absolute;left:22px;right:20px;top:286px;display:flex;justify-content:space-between;align-items:center}
.row1 h1{font:900 38px/1 var(--f);letter-spacing:-.5px}
.pill{background:var(--green);color:#fff;font:900 13px/1 var(--f);letter-spacing:.6px;text-transform:uppercase;padding:9px 13px;border-radius:20px;box-shadow:0 3px 0 #0C4F32;animation:pop .5s 1.45s var(--pop) both}
.scale{position:absolute;left:22px;right:22px;top:338px}
.scale div{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.scale i{height:10px;border-radius:5px;background:#C9DCE4}
.scale i:nth-child(1){background:#7C93A0}.scale i:nth-child(2){background:#1FA46A;box-shadow:0 0 0 3px rgba(31,164,106,.28)}
.scale i:nth-child(3){background:#BFD3F2}.scale i:nth-child(4){background:#F4D2A3}.scale i:nth-child(5){background:#F2E2A0}
.scale p{margin-top:8px;font:700 14px var(--f);color:#33576A}
.verdict{position:absolute;left:22px;right:22px;top:402px;height:48px;border-radius:24px;background:#DDF6E8;color:#0B5333;display:flex;align-items:center;justify-content:center;gap:8px;font:800 15px/1 var(--f)}
.xp{position:absolute;left:20px;right:20px;top:598px;height:44px;border-radius:22px;background:var(--deep);color:#fff;display:flex;align-items:center;gap:12px;padding:0 16px;font:800 14px/1 var(--f);animation:pop .5s 1.9s var(--pop) both}
.xp .t{flex:1;height:10px;border-radius:5px;background:rgba(255,255,255,.22);overflow:hidden}
.xp .t i{display:block;width:27%;height:100%;border-radius:5px;background:#FFC93C}
.btns{position:absolute;left:20px;right:20px;bottom:46px;display:flex;flex-direction:column;gap:12px}
.btns button{height:58px;border-radius:29px;font:900 18px/1 var(--f);display:flex;align-items:center;justify-content:center;gap:10px}
.go{background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(214,243,250,.9));color:var(--navy);box-shadow:inset 0 2px 0 #fff,inset 0 -3px 0 rgba(30,130,170,.3),0 8px 20px rgba(4,50,80,.35);height:64px!important}
.sh{color:var(--navy);height:52px!important;font-size:16px!important}
@keyframes cardin{from{opacity:0;transform:translateY(60px) scale(.88)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@keyframes fin{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.card,.fish,.pill,.xp,.shadow{animation:fade .4s both}.ripple,.bub i{display:none}@keyframes fade{from{opacity:0}to{opacity:1}}.fish{transform:rotate(-5deg)}}
</style>
</head>
<body>
<main class="screen">
<div class="rays"></div>

<div class="island"></div><div class="status"><span>17:44</span><span class="ic"><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><path d="M8.5 2.3c2.3 0 4.4.9 6 2.4l1-1.1A10.4 10.4 0 0 0 8.5.7 10.4 10.4 0 0 0 1.5 3.6l1 1.1a8.8 8.8 0 0 1 6-2.4Zm0 3.5c1.3 0 2.5.5 3.4 1.3l1-1.1a7 7 0 0 0-8.8 0l1 1.1c.9-.8 2.1-1.3 3.4-1.3Zm0 3.4c.6 0 1.1.2 1.5.6L8.5 11.5 7 9.800c.4-.4.9-.6 1.5-.6Z"/></svg><svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.8" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2.6" fill="currentColor"/><path d="M25 4.5v4c.8-.3 1.5-1.1 1.5-2s-.7-1.7-1.5-2Z" fill="currentColor" opacity=".45"/></svg></span></div><div class="home"></div>

<button class="x glass" aria-label="Fermer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>

</section>

<div class="btns">

</div>
</main>
</body>
</html>
