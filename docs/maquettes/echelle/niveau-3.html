<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=393, initial-scale=1, viewport-fit=cover">
<title>Niveau 3 · Révélation de la prise</title>
<style>
@font-face{font-family:Baloo;font-weight:600;src:url(fonts/baloo-2-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:Baloo;font-weight:800;src:url(fonts/baloo-2-latin-800-normal.woff2) format('woff2')}
:root{--ink:#17363F;--cream:#FFF7E8;--teal:#1D8A94;--deep:#0E5C66;--bounce:cubic-bezier(.3,1.7,.5,1);--f:Baloo,system-ui,sans-serif;--sb:#4A2A1A}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#d9dedf}
body{display:flex;justify-content:center;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:3px solid #0b57d0;outline-offset:3px}
.screen{position:relative;width:393px;height:852px;overflow:hidden}
.island{position:absolute;top:11px;left:50%;width:124px;height:36px;margin-left:-62px;background:#000;border-radius:20px;z-index:40}
.status{position:absolute;top:0;left:0;right:0;height:54px;z-index:30;display:flex;justify-content:space-between;align-items:center;padding:8px 32px 0 50px;font:600 17px/1 -apple-system,"SF Pro Text",system-ui,sans-serif;color:var(--sb,#111)}
.status .ic{display:flex;gap:6px;align-items:center}
.home{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--sb,#111);z-index:40}
.glass{background:linear-gradient(160deg,rgba(255,255,255,.62),rgba(255,255,255,.2));-webkit-backdrop-filter:blur(20px) saturate(1.9);backdrop-filter:blur(20px) saturate(1.9);border:1px solid rgba(255,255,255,.65);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 -1px 1px rgba(255,255,255,.35),inset 0 0 14px rgba(255,255,255,.25),0 10px 28px rgba(10,40,50,.2)}

.screen{background:#FFD9B0;font-family:var(--f);color:var(--ink)}
.scene{position:absolute;inset:0}
.top{position:absolute;top:58px;left:0;right:0;text-align:center;font:800 24px/1 var(--f);color:#4A2A1A}
.top small{display:block;font:600 15px var(--f);margin-top:4px;color:#5A3420}
.x{position:absolute;top:56px;left:16px;width:46px;height:46px;border-radius:23px;display:grid;place-items:center;color:#4A2A1A;z-index:5}
.card{position:absolute;top:118px;left:20px;width:353px;height:508px;border-radius:40px;background:var(--cream);box-shadow:0 12px 0 rgba(120,60,20,.18),0 28px 40px -10px rgba(120,50,20,.35);animation:drop .9s var(--bounce) both;transform-origin:50% 100%}
.art{position:absolute;left:10px;right:10px;top:10px;height:276px;border-radius:32px;overflow:hidden;background:#34A3AD}
.art svg.bg{position:absolute;inset:0}
.fishwrap{position:absolute;left:14px;top:116px;width:296px;transform:rotate(-4deg);filter:drop-shadow(0 12px 0 rgba(8,60,70,.28));animation:swim 1.1s .5s var(--bounce) both}
.fishwrap img{width:100%;display:block;filter:url(#post)}
.medal{position:absolute;right:14px;top:14px;width:84px;height:104px;transform:rotate(8deg);animation:stamp .6s 1.35s var(--bounce) both;filter:drop-shadow(0 5px 0 rgba(8,60,70,.3))}
.medal svg{width:84px;height:84px;display:block}
.medal .rb{position:absolute;left:50%;bottom:0;transform:translateX(-50%);white-space:nowrap;background:#FFC24B;color:#3B1F00;font:800 13px/1 var(--f);padding:6px 10px 5px;border-radius:9px;border:3px solid #fff}
.spark{position:absolute;color:#fff;animation:pop .5s var(--bounce) both}
.name{position:absolute;left:24px;top:296px;font:800 46px/1 var(--f);letter-spacing:-.5px}
.size{position:absolute;right:20px;top:298px;background:#FFC24B;color:#3B1F00;font:800 26px/1 var(--f);padding:8px 16px 6px;border-radius:22px;transform:rotate(-4deg);box-shadow:0 4px 0 #D98B14;animation:pop .5s 1.1s var(--bounce) both}
.size small{font-size:18px}
.freq{position:absolute;left:24px;top:350px;font:600 16px var(--f);color:#3E5961}
.verdict{position:absolute;left:18px;right:18px;top:384px;height:52px;border-radius:26px;background:#CDEFD4;color:#0B4A2A;display:flex;align-items:center;gap:10px;padding:0 16px;font:800 17px/1 var(--f)}
.xp{position:absolute;left:24px;right:24px;top:450px}
.xp p{display:flex;justify-content:space-between;font:800 15px/1 var(--f);margin-bottom:8px}
.xp .seg{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.xp .seg i{height:16px;border-radius:8px;background:#EBDFC9}
.xp .seg i.on{background:var(--teal)}
.xp .seg i.new{background:#FFB22E;animation:fill .5s 1.9s var(--bounce) both}
.btns{position:absolute;left:20px;right:20px;bottom:44px;display:flex;flex-direction:column;gap:10px}
.btns button{border-radius:34px;font:800 21px/1 var(--f);display:flex;align-items:center;justify-content:center;gap:10px;animation:rise .6s 1.6s var(--bounce) both}
.go{height:68px;background:linear-gradient(180deg,rgba(18,125,136,.92),rgba(10,84,95,.96));color:#fff;border:1px solid rgba(255,255,255,.55)!important;box-shadow:inset 0 2px 0 rgba(255,255,255,.55),inset 0 -4px 0 rgba(0,40,50,.3),0 10px 22px rgba(6,60,70,.4)!important}
.sh{height:56px;color:#0B3B45;font-size:18px!important;animation-delay:1.75s!important}
@keyframes drop{0%{opacity:0;transform:translateY(-120%) scaleY(1.1)}55%{opacity:1;transform:translateY(0) scaleY(.94)}100%{transform:none}}
@keyframes swim{0%{opacity:0;transform:translateX(-160px) rotate(-14deg)}100%{opacity:1;transform:rotate(-4deg)}}
@keyframes stamp{0%{opacity:0;transform:rotate(-30deg) scale(2.4)}100%{opacity:1;transform:rotate(8deg)}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1}}
.size{--r:-4deg}
@keyframes rise{0%{opacity:0;transform:translateY(40px)}100%{opacity:1;transform:none}}
@keyframes fill{0%{opacity:0;transform:scale(.2)}100%{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.card,.fishwrap,.medal,.size,.spark,.btns button,.xp .seg i.new{animation:fade .4s both}@keyframes fade{from{opacity:0}to{opacity:1}}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<filter id="post" x="-6%" y="-12%" width="112%" height="124%" color-interpolation-filters="sRGB">
 <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b"/>
 <feColorMatrix in="b" type="saturate" values="1.1" result="s"/>
 <feComponentTransfer in="s" result="fx">
  <feFuncR type="discrete" tableValues=".16 .42 .70 .94"/>
  <feFuncG type="discrete" tableValues=".12 .36 .64 .90"/>
  <feFuncB type="discrete" tableValues=".08 .26 .52 .84"/>
  <feFuncA type="discrete" tableValues="0 1"/>
 </feComponentTransfer>
 <feMorphology in="fx" operator="dilate" radius="3" result="d"/>
 <feFlood flood-color="#FFF7E8"/>
 <feComposite in2="d" operator="in" result="o"/>
 <feMerge><feMergeNode in="o"/><feMergeNode in="fx"/></feMerge>
</filter></defs></svg>
<main class="screen">
<svg class="scene" viewBox="0 0 393 852" preserveAspectRatio="none" aria-hidden="true">
 <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE9C9"/><stop offset=".55" stop-color="#FFC59A"/><stop offset="1" stop-color="#FFB08A"/></linearGradient></defs>
 <rect width="393" height="852" fill="url(#sky)"/>
 <circle cx="300" cy="150" r="90" fill="#FFF3D8" opacity=".75"/><circle cx="300" cy="150" r="56" fill="#FFF8E6"/>
 <path d="M0 640 Q90 590 190 630 T393 600 V852 H0Z" fill="#F29C7B"/>
 <path d="M0 700 Q110 650 210 690 T393 670 V852 H0Z" fill="#2B97A1"/>
 <path d="M0 770 Q100 735 200 765 T393 750 V852 H0Z" fill="#1A7782"/>
</svg>
<div class="island"></div><div class="status"><span>17:44</span><span class="ic"><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><path d="M8.5 2.3c2.3 0 4.4.9 6 2.4l1-1.1A10.4 10.4 0 0 0 8.5.7 10.4 10.4 0 0 0 1.5 3.6l1 1.1a8.8 8.8 0 0 1 6-2.4Zm0 3.5c1.3 0 2.5.5 3.4 1.3l1-1.1a7 7 0 0 0-8.8 0l1 1.1c.9-.8 2.1-1.3 3.4-1.3Zm0 3.4c.6 0 1.1.2 1.5.6L8.5 11.5 7 9.800c.4-.4.9-.6 1.5-.6Z"/></svg><svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.8" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2.6" fill="currentColor"/><path d="M25 4.5v4c.8-.3 1.5-1.1 1.5-2s-.7-1.7-1.5-2Z" fill="currentColor" opacity=".45"/></svg></span></div><div class="home"></div>

<button class="x glass" aria-label="Fermer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
<div class="top">Nouvelle prise<small>La Marne, Val-de-Marne (94)</small></div>
<section class="card" aria-label="Brochet, 68 cm">
 <div class="art">
  <svg class="bg" viewBox="0 0 333 276" preserveAspectRatio="none" aria-hidden="true">
   <rect width="333" height="276" fill="#34A3AD"/>
   <circle cx="166" cy="150" r="118" fill="#4FBBC2"/><circle cx="166" cy="150" r="78" fill="#6FD0D3"/>
   <path d="M0 214 Q42 198 84 214 T168 214 T252 214 T336 214 V276 H0Z" fill="#2A8D98"/>
   <path d="M0 244 Q42 230 84 244 T168 244 T252 244 T336 244 V276 H0Z" fill="#1F7A86"/>
  </svg>
  <div class="fishwrap"><img src="img/brochet.png" alt="Brochet"></div>
  <div class="medal"><svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="94.0,50.0 89.0,58.9 89.6,69.1 81.3,74.9 77.4,84.4 67.4,86.0 59.8,92.9 50.0,90.0 40.2,92.9 32.6,86.0 22.6,84.4 18.7,74.9 10.4,69.1 11.0,58.9 6.0,50.0 11.0,41.1 10.4,30.9 18.7,25.1 22.6,15.6 32.6,14.0 40.2,7.1 50.0,10.0 59.8,7.1 67.4,14.0 77.4,15.6 81.3,25.1 89.6,30.9 89.0,41.1" fill="#fff"/><circle cx="50" cy="50" r="33" fill="#2FB57A"/><circle cx="50" cy="50" r="33" fill="none" stroke="#9BE3BE" stroke-width="3" stroke-dasharray="2 5" stroke-linecap="round"/><path d="M38 52l8-17 8 17" fill="none"/><path d="M50 30l5.200 10.500 11.600 1.700-8.400 8.200 2 11.600L50 56.500l-10.400 5.500 2-11.600-8.400-8.200 11.600-1.700z" fill="#fff"/></svg><span class="rb">Peu commun</span></div>
 </div>
 <div class="name">Brochet</div><div class="size">68 <small>cm</small></div>
 <div class="freq">10 pêches sur 29 dans le 94</div>
 <div class="verdict"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="11" fill="#2FB57A"/><path d="M7 12.500l3.500 3.500L17 9" stroke="#fff" stroke-width="3"/></svg>Garder possible · 68 / 60 cm mini</div>
 <div class="xp"><p><span>Pescedex</span><span>3 sur 11 espèces</span></p><div class="seg" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="new"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
</section>
<div class="btns">
 <button class="go glass">Ranger dans le Pescedex</button>
 <button class="sh glass"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7.500 7.500L12 3l4.500 4.500M5 11v9h14v-9"/></svg>Partager</button>
</div>
</main>
</body>
</html>
