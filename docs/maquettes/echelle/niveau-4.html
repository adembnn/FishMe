<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=393, initial-scale=1, viewport-fit=cover">
<title>Niveau 4 · Révélation de la prise</title>
<style>
@font-face{font-family:Fredoka;font-weight:600;src:url(fonts/fredoka-600.woff2) format('woff2')}
@font-face{font-family:Fredoka;font-weight:700;src:url(fonts/fredoka-700.woff2) format('woff2')}
:root{--ink:#0B3532;--cream:#FFFBEF;--spring:cubic-bezier(.3,1.8,.45,1);--f:Fredoka,system-ui,sans-serif;--sb:#06302E}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#d9dedf}
body{display:flex;justify-content:center;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:3px solid #0b57d0;outline-offset:3px}
.screen{position:relative;width:393px;height:852px;overflow:hidden}
.island{position:absolute;top:11px;left:50%;width:124px;height:36px;margin-left:-62px;background:#000;border-radius:20px;z-index:40}
.status{position:absolute;top:0;left:0;right:0;height:54px;z-index:30;display:flex;justify-content:space-between;align-items:center;padding:8px 32px 0 50px;font:600 17px/1 -apple-system,"SF Pro Text",system-ui,sans-serif;color:var(--sb,#111)}
.status .ic{display:flex;gap:6px;align-items:center}
.home{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--sb,#111);z-index:40}
.glass{background:linear-gradient(160deg,rgba(255,255,255,.62),rgba(255,255,255,.2));-webkit-backdrop-filter:blur(20px) saturate(1.9);backdrop-filter:blur(20px) saturate(1.9);border:1px solid rgba(255,255,255,.65);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 -1px 1px rgba(255,255,255,.35),inset 0 0 14px rgba(255,255,255,.25),0 10px 28px rgba(10,40,50,.2)}

.screen{background:linear-gradient(180deg,#8DE6CE 0,#35C3B3 45%,#12A1A4 100%);font-family:var(--f);color:var(--ink)}
.blob{position:absolute;border-radius:50%;background:rgba(255,255,255,.2)}
.top{position:absolute;top:58px;left:0;right:0;text-align:center;font:700 24px/1 var(--f);color:#06302E}
.top small{display:block;font:600 15px var(--f);margin-top:4px}
.x{position:absolute;top:56px;left:16px;width:46px;height:46px;border-radius:23px;display:grid;place-items:center;color:#06302E;z-index:5}
.card{position:absolute;top:226px;left:18px;width:357px;height:404px;border-radius:40px;background:var(--cream);box-shadow:0 26px 40px -14px rgba(4,60,60,.55);transform:rotate(-1.6deg);animation:cardin .8s var(--spring) both}
.fish{position:absolute;left:12px;top:100px;width:346px;z-index:6;transform:rotate(-8deg);filter:drop-shadow(0 18px 10px rgba(4,70,70,.35));animation:leap 1.3s .3s both}
@keyframes leap{0%{opacity:0;transform:translate(-30px,230px) rotate(26deg) scale(.7)}40%{opacity:1}70%{transform:translate(0,-26px) rotate(-12deg) scale(1.04)}100%{transform:rotate(-8deg)}}
.splash i{position:absolute;width:10px;height:10px;border-radius:50%;background:#fff;opacity:0;animation:spl .9s ease-out both}
@keyframes spl{0%{opacity:.95;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--dx),var(--dy))}}
.name{position:absolute;left:24px;top:62px;font:700 46px/1 var(--f);letter-spacing:-.3px}
.drop{position:absolute;right:20px;top:54px;display:flex;align-items:center;gap:8px;background:#DDF5A8;color:#2C4A00;font:700 15px/1 var(--f);padding:7px 14px 7px 8px;border-radius:22px;animation:pop .5s 1.45s var(--spring) both}
.drop svg{flex:none}
.size{position:absolute;left:24px;top:132px;font:700 70px/.9 var(--f);letter-spacing:-2px;color:#E8553C}
.size small{font-size:26px;letter-spacing:0;margin-left:4px}
.size span{display:block;font:600 14px var(--f);letter-spacing:0;color:#406360;margin-top:6px}
.gauge{position:absolute;right:22px;top:122px;width:104px;height:104px;border-radius:50%;background:#D9F1F0;overflow:hidden;box-shadow:inset 0 0 0 5px #fff,0 6px 14px rgba(10,90,90,.25)}
.gauge .w{position:absolute;left:-20%;width:140%;bottom:0;height:34%;background:linear-gradient(#5CD0DC,#2B9FC4);border-radius:40% 40% 0 0;animation:wave 1s 1.1s ease-out both}
.gauge b{position:absolute;inset:0;display:grid;place-items:center;font:700 32px/1 var(--f);color:#0B3532}
.gauge b small{display:block;font:600 13px var(--f)}
.cap{position:absolute;left:24px;right:24px;top:246px;font:600 16px var(--f);color:#2E5753}
.verdict{position:absolute;left:18px;right:18px;top:280px;height:52px;border-radius:26px;background:#CFF3D3;color:#0A4426;display:flex;align-items:center;gap:10px;padding:0 16px;font:700 17px/1 var(--f)}
.xp{position:absolute;left:24px;right:24px;top:348px;display:flex;align-items:center;gap:12px;font:700 15px/1 var(--f)}
.xp .dots{display:flex;gap:5px;flex:1}
.xp .dots i{flex:1;aspect-ratio:1;border-radius:50%;background:#DDE7DD}
.xp .dots i.on{background:#18A39F}.xp .dots i.new{background:#FFB22E;animation:pop .5s 1.9s var(--spring) both}
.conf i{position:absolute;top:-20px;border-radius:2px;opacity:0;animation:fall 1.4s linear both;transform:rotate(var(--r))}
@keyframes fall{0%{opacity:1;transform:translateY(0) rotate(var(--r))}100%{opacity:0;transform:translateY(560px) rotate(calc(var(--r) + 300deg))}}
.btns{position:absolute;left:20px;right:20px;bottom:44px;display:flex;flex-direction:column;gap:10px}
.btns button{border-radius:33px;font:700 20px/1 var(--f);display:flex;align-items:center;justify-content:center;gap:10px;animation:rise .6s 1.6s var(--spring) both}
.go{height:66px;background:linear-gradient(180deg,rgba(255,150,118,.95),rgba(255,111,80,.95));color:#2E0A02;border:1px solid rgba(255,255,255,.6)!important;box-shadow:inset 0 2px 0 rgba(255,255,255,.7),inset 0 -4px 0 rgba(160,40,15,.3),0 10px 22px rgba(4,70,70,.4)!important}
.sh{height:54px;color:#06302E;font-size:17px!important;animation-delay:1.75s!important}
@keyframes cardin{0%{opacity:0;transform:translateY(160px) rotate(6deg)}100%{opacity:1;transform:rotate(-1.6deg)}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:none}}
@keyframes rise{0%{opacity:0;transform:translateY(40px)}100%{opacity:1;transform:none}}
@keyframes wave{0%{transform:translateY(100%)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.card,.fish,.drop,.btns button,.xp .dots i.new,.gauge .w{animation:fade .4s both}.conf,.splash{display:none}@keyframes fade{from{opacity:0}to{opacity:1}}.fish{transform:rotate(-8deg)}}
</style>
</head>
