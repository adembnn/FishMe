<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=393, initial-scale=1, viewport-fit=cover">
<title>Niveau 1 · Révélation de la prise</title>
<style>
@font-face{font-family:Quicksand;font-weight:700;src:url(fonts/quicksand-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:Quicksand;font-weight:600;src:url(fonts/quicksand-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:Hanken;font-weight:400;src:url(fonts/hanken-grotesk-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Hanken;font-weight:600;src:url(fonts/hanken-grotesk-latin-600-normal.woff2) format('woff2')}
:root{--paper:#fff;--ink:#14181B;--ink2:#4A5258;--teal:#1F4A47;--green:#176B42;--uncommon:#2E9E6B;--ease:cubic-bezier(.16,1,.3,1);
--round:Quicksand,'Hanken',system-ui,sans-serif;--sans:Hanken,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#d9dedf}
body{display:flex;justify-content:center;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:3px solid #0b57d0;outline-offset:3px}
.screen{position:relative;width:393px;height:852px;overflow:hidden}
.island{position:absolute;top:11px;left:50%;width:124px;height:36px;margin-left:-62px;background:#000;border-radius:20px;z-index:40}
.status{position:absolute;top:0;left:0;right:0;height:54px;z-index:30;display:flex;justify-content:space-between;align-items:center;padding:8px 32px 0 50px;font:600 17px/1 -apple-system,"SF Pro Text",system-ui,sans-serif;color:var(--sb,#111)}
.status .ic{display:flex;gap:6px;align-items:center}
.home{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--sb,#111);z-index:40}
.glass{background:linear-gradient(160deg,rgba(255,255,255,.62),rgba(255,255,255,.2));-webkit-backdrop-filter:blur(20px) saturate(1.9);backdrop-filter:blur(20px) saturate(1.9);border:1px solid rgba(255,255,255,.65);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 -1px 1px rgba(255,255,255,.35),inset 0 0 14px rgba(255,255,255,.25),0 10px 28px rgba(10,40,50,.2)}

.screen{background:linear-gradient(#F4FAF8 0,#E4F1EC 60%,#D3E8E0);font-family:var(--sans);color:var(--ink)}
.verdict{position:absolute;top:66px;left:24px;right:24px;display:flex;align-items:center;gap:8px;font:700 16px/1 var(--round);color:var(--green)}
.verdict svg{flex:none}
.card{position:absolute;top:110px;left:24px;width:345px;height:520px;border-radius:26px;overflow:hidden;background:var(--teal);box-shadow:0 18px 36px -14px rgba(20,50,47,.45),0 2px 4px rgba(20,50,47,.2);animation:rise .7s var(--ease) both}
.art{position:absolute;inset:0 0 200px 0;background:radial-gradient(120% 90% at 30% 20%,#2C6560,#1F4A47 60%,#173B39)}
.art::before{content:"";position:absolute;inset:10px;border:1px solid rgba(255,255,255,.22);border-radius:18px}
.rings{position:absolute;inset:0;opacity:.35}
.cent{position:absolute;left:24px;top:22px;color:#EAF3EF;font:700 13px/1.3 var(--round)}
.cent b{display:block;font:700 46px/1 var(--round);letter-spacing:-1px;color:#fff}
.cent b i{font-style:normal;font-size:22px}
.fish{position:absolute;left:22px;top:100px;width:318px;transform:rotate(-24deg);filter:drop-shadow(0 10px 8px rgba(0,0,0,.4));clip-path:inset(-20% 100% -20% -10%);animation:engrave 1.1s .5s cubic-bezier(.5,0,.2,1) forwards}
.rar{position:absolute;right:20px;top:18px;display:flex;align-items:center;gap:8px;color:#fff;font:700 14px/1 var(--round);letter-spacing:.2px;animation:stamp .5s 1.5s var(--ease) both}
.rar svg{filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.sheen{position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.28) 50%,transparent 60%);transform:translateX(-120%);animation:sheen .9s .7s ease-out forwards;pointer-events:none;z-index:3}
.panel{position:absolute;left:0;right:0;bottom:0;height:238px;background:#EBF0EE;clip-path:polygon(0 22px,100% 0,100% 100%,0 100%);padding:46px 22px 0}
.name{display:flex;align-items:baseline;gap:10px}
.name h1{font:700 34px/1 var(--round);letter-spacing:-.3px}
.name i{font:italic 400 15px var(--sans);color:var(--ink2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px;padding-top:12px;border-top:1px solid #C3CBC8}
.stats b{display:block;font:700 28px/1 var(--round)}
.stats b small{font-size:14px;margin-left:2px}
.stats span{font:600 13px/1.6 var(--sans);color:var(--ink2)}
.foot{position:absolute;left:22px;right:22px;bottom:14px;display:flex;justify-content:space-between;font:400 14px var(--sans);color:var(--ink2)}
.foot b{font-weight:600;color:var(--ink)}
.xp{position:absolute;left:24px;right:24px;top:648px;display:flex;align-items:center;gap:12px;font:700 14px/1 var(--round)}
.xp .seg{flex:1;display:grid;grid-template-columns:repeat(11,1fr);gap:3px}
.xp .seg i{height:10px;border-radius:5px;background:#CFD8D4}
.xp .seg i.on{background:var(--green)}
.xp .seg i.new{background:var(--green);animation:fill .5s 1.9s var(--ease) both}
.where{position:absolute;left:24px;top:684px;font:400 14px var(--sans);color:var(--ink2)}
.bar{position:absolute;left:24px;right:24px;bottom:42px;height:68px;border-radius:34px;padding:7px;display:flex;gap:6px}
.bar button{height:52px;border-radius:26px;font:700 16px/1 var(--round);display:flex;align-items:center;justify-content:center;gap:7px}
.go{flex:2.1;white-space:nowrap;font-size:15px!important;padding:0 6px;background:linear-gradient(180deg,rgba(40,150,98,.92),rgba(22,112,70,.95));color:#fff;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),0 4px 10px rgba(20,100,60,.35)}
.sh{flex:.95;white-space:nowrap;color:var(--ink)}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.97)}to{opacity:1;transform:none}}
@keyframes engrave{to{clip-path:inset(-20% -10% -20% -10%)}}
@keyframes sheen{to{transform:translateX(120%)}}
@keyframes stamp{from{opacity:0;transform:scale(1.5) rotate(-8deg)}to{opacity:1;transform:none}}
@keyframes fill{from{opacity:.2;transform:scaleX(.2)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.card,.fish,.rar,.xp .seg i.new{animation:fade .4s both}.fish{clip-path:none}.sheen{display:none}@keyframes fade{from{opacity:0}to{opacity:1}}}
</style>
</head>
<body>
<main class="screen">
<div class="island"></div><div class="status"><span>17:44</span><span class="ic"><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><path d="M8.5 2.3c2.3 0 4.4.9 6 2.4l1-1.1A10.4 10.4 0 0 0 8.5.7 10.4 10.4 0 0 0 1.5 3.6l1 1.1a8.8 8.8 0 0 1 6-2.4Zm0 3.5c1.3 0 2.5.5 3.4 1.3l1-1.1a7 7 0 0 0-8.8 0l1 1.1c.9-.8 2.1-1.3 3.4-1.3Zm0 3.4c.6 0 1.1.2 1.5.6L8.5 11.5 7 9.800c.4-.4.9-.6 1.5-.6Z"/></svg><svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.8" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2.6" fill="currentColor"/><path d="M25 4.5v4c.8-.3 1.5-1.1 1.5-2s-.7-1.7-1.5-2Z" fill="currentColor" opacity=".45"/></svg></span></div><div class="home"></div>

<div class="verdict"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l7.5 3v6c0 4.5-3 8-7.500 10-4.500-2-7.500-5.500-7.500-10v-6z"/><path d="M8.500 12l2.5 2.500 4.500-5"/></svg>Garder possible · 68 / 60 cm mini</div>
<section class="card" aria-label="Brochet, 68 cm">
 <div class="art">
  <svg class="rings" viewBox="0 0 345 300" fill="none" stroke="#fff" stroke-width=".8"><ellipse cx="230" cy="130" rx="40" ry="30"/><ellipse cx="230" cy="130" rx="80" ry="60"/><ellipse cx="230" cy="130" rx="125" ry="92"/><ellipse cx="230" cy="130" rx="175" ry="126"/><ellipse cx="230" cy="130" rx="230" ry="165"/></svg>
  <div class="cent"><b>84<i>e</i></b>centile de taille</div>
  <div class="rar"><svg width="46" height="50" viewBox="0 0 38 42"><path d="M19 1l16 9.500v21L19 41 3 31.500v-21z" fill="#2E9E6B" stroke="#E6F5EC" stroke-width="2"/><path d="M19 1l16 9.500L19 20 3 10.500z" fill="#fff" opacity=".28"/><circle cx="14.500" cy="25" r="2.600" fill="#fff"/><circle cx="23.500" cy="25" r="2.600" fill="#fff"/></svg>Peu commun</div>
  <img class="fish" src="img/brochet.png" alt="Brochet">
 </div>
 <div class="panel">
  <div class="name"><h1>Brochet</h1><i>Esox lucius</i></div>
  <div class="stats"><div><b>68<small>cm</small></b><span>Taille</span></div><div><b>34<small>%</small></b><span>Fréquence</span></div><div><b>4<small>ans</small></b><span>Âge estimé</span></div></div>
  <div class="foot"><span>10 pêches sur 29 dans le 94</span><b>n° 014</b></div>
 </div>
 <div class="sheen"></div>
</section>
<div class="xp"><div class="seg" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="new"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><span>3 sur 11 espèces</span></div>
<div class="where">La Marne, Val-de-Marne (94)</div>
<div class="bar glass">
 <button class="go"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h4v16H4zM10 4h4v16h-4z"/><path d="M16.500 5.500l3.500-1 3 15-3.500 1z" transform="translate(-2 0)"/></svg>Ranger dans le Pescedex</button>
 <button class="sh"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7.500 7.500L12 3l4.500 4.500M5 11v9h14v-9"/></svg>Partager</button>
</div>
</main>
</body>
</html>
