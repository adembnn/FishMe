<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=1600"><title>Les quatre fils</title><style>

@font-face{font-family:"Alfa Slab One";src:url(alfa-slab-one-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:block}
:root{--forest:#2F5D3A;--forest-d:#20432A;--khaki:#CBB98A;--khaki-l:#E3D7B2;--cream:#F5EDD3;--mustard:#D9B64A;--brick:#B5452E;--denim:#3B5163;--denim-l:#41708A;--ink:#25301F;

*{box-sizing:border-box;margin:0;padding:0}
html{background:#111}
svg text{font-family:var(--slab)}

body{width:1600px;height:900px;overflow:hidden;position:relative;color:var(--cream);font-family:var(--sys);
background:repeating-linear-gradient(135deg,rgba(255,255,255,.045) 0 2px,transparent 2px 5px),radial-gradient(120% 90% at 20% 10%,#3a566b,#2f4455 60%,#27394a)}
header{position:absolute;left:72px;top:48px;width:700px}
h1{font:400 44px/1.05 var(--slab);letter-spacing:.3px}
header p{margin-top:12px;font-size:19px;line-height:1.4;max-width:560px;opacity:.95}
.bw{position:absolute;right:72px;top:44px;text-align:left}
.bw small{display:block;font-size:14px;font-weight:600;margin-bottom:8px;letter-spacing:.4px;opacity:.9}
.bw div{display:flex;gap:14px;filter:grayscale(1) contrast(1.05)}
.bw svg{width:96px;height:auto;display:block;overflow:visible}
.row{position:absolute;left:72px;right:72px;top:236px;display:grid;grid-template-columns:repeat(4,1fr);gap:30px}
figure{display:block}
.pw{transform:rotate(var(--rot))}
.pw svg{width:345px;display:block;overflow:visible;filter:drop-shadow(0 2px 0 rgba(0,0,0,.3))}
figcaption{margin-top:22px;max-width:340px}
figcaption b{display:block;font:400 24px/1.1 var(--slab);color:var(--mustard)}
figcaption span{display:block;margin-top:6px;font-size:18px;line-height:1.4}
