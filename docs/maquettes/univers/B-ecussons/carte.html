.chip{position:absolute;left:16px;top:62px;height:42px;padding:0 16px 0 12px;border-radius:21px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;--r:21px;z-index:5}

.sheet{position:absolute;left:12px;right:12px;bottom:106px;border-radius:28px;padding:16px 18px 16px;--r:28px;z-index:6;color:var(--ink)}
.sheet h2{font:400 24px/1 var(--slab);letter-spacing:.2px}
.sheet .l{white-space:nowrap;font-size:15px;font-weight:600;margin-top:6px;letter-spacing:-.1px}
.sheet .row{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1}
.sheet .minis{display:flex;margin-top:14px;align-items:center;gap:0;position:relative;z-index:1}
.mini{width:58px;height:58px;margin-right:-8px;filter:drop-shadow(0 1px 0 rgba(37,48,31,.25))}

.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;font-weight:600;color:#3A4630;position:relative;z-index:1}
.tab.on{color:var(--forest-d)}
.tab.on .ic{background:rgba(47,93,58,.18);border-radius:14px}
.ic{width:46px;height:30px;display:grid;place-items:center}
.sortie{position:relative;z-index:1;justify-self:center;margin-top:-34px;width:78px;height:78px;border-radius:50%;background:linear-gradient(180deg,#E3C25C,#C9A22F);border:3px solid rgba(255,250,232,.85);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.6),0 6px 14px rgba(60,50,10,.3);display:grid;place-items:center;text-align:center;font:400 14px/1 var(--slab);color:var(--ink)}

.home{background:#14180f}
