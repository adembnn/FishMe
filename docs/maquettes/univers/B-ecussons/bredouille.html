@font-face{font-family:"Alfa Slab One";src:url(alfa-slab-one-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:block}
:root{--forest:#2F5D3A;--forest-d:#20432A;--khaki:#CBB98A;--khaki-l:#E3D7B2;--cream:#F5EDD3;--mustard:#D9B64A;--brick:#B5452E;--denim:#3B5163;--denim-l:#41708A;--ink:#25301F;

*{box-sizing:border-box;margin:0;padding:0}

.sb .isl{position:absolute;left:50%;top:11px;width:122px;height:36px;margin-left:-61px;border-radius:20px;background:#000}
.sb .r{position:absolute;right:30px;top:21px;display:flex;gap:6px;align-items:center}
.home{position:absolute;bottom:8px;left:50%;width:138px;height:5px;margin-left:-69px;border-radius:3px;z-index:30}.glass{position:relative;background:linear-gradient(140deg,rgba(255,250,232,.46),rgba(255,250,232,.16));-webkit-backdrop-filter:blur(20px) saturate(1.7);backdrop-filter:blur(20px) saturate(1.7);border:1px solid rgba(255,255,255,.6);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.75),inset 0 -1px 0 rgba(255,255,255,.2),0 2px 0 rgba(30,40,20,.12)}
.glass.seam::after{content:"";position:absolute;inset:5px;border-radius:inherit;border:1.5px dashed rgba(255,250,232,.8);pointer-events:none;border-radius:calc(var(--r,24px) - 5px)}
.glass.dark{background:linear-gradient(140deg,rgba(18,30,42,.52),rgba(18,30,42,.3));border-color:rgba(255,255,255,.28);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.4),0 2px 0 rgba(0,0,0,.25)}
body{width:393px;height:852px;overflow:hidden;position:relative;font-family:var(--sys);color:var(--ink)}
.ging{background:linear-gradient(rgba(245,237,211,.22) 50%,transparent 50%) 0 0/30px 30px,linear-gradient(90deg,rgba(245,237,211,.22) 50%,transparent 50%) 0 0/30px 30px,#CBB98A}
.denim{color:var(--cream);background:repeating-linear-gradient(135deg,rgba(255,255,255,.045) 0 2px,transparent 2px 5px),radial-gradient(120% 70% at 30% 20%,#3a566b,#2f4455 60%,#27394a)}
.felt{color:var(--cream);background:radial-gradient(120% 80% at 30% 15%,#3a7049,#2F5D3A 55%,#244a2e)}
.x{position:absolute;left:16px;top:62px;width:42px;height:42px;border-radius:21px;display:grid;place-items:center;--r:21px;z-index:5}
.eyebrow{font:400 13px/1 var(--slab);letter-spacing:1.4px;text-transform:uppercase}
.btn-p{height:54px;border-radius:27px;border:1px solid rgba(255,255,255,.35);background:linear-gradient(180deg,#AE4029,#8E2F1C);color:var(--cream);font:400 17px/1 var(--slab);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.35),0 2px 0 rgba(0,0,0,.25)}
.btn-g{height:46px;border-radius:23px;background:rgba(245,237,211,.14);border:1px solid rgba(245,237,211,.45);color:inherit;font:600 16px var(--sys)}
.sheet .btn-p{width:100%}.small{font-size:13px;line-height:1.35;opacity:.9}
.home{background:#14180f}.denim .home,.felt .home{background:#fff}
.mp{display:block;width:100%;height:auto;overflow:visible}
.tabs{position:absolute;left:14px;right:14px;bottom:24px;height:72px;border-radius:36px;display:grid;grid-template-columns:1fr 1fr 1.15fr 1fr;align-items:center;--r:36px;z-index:7;padding:0 8px;color:#3A4630}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;font-weight:600;position:relative;z-index:1}
.tab.on{color:var(--forest-d)}.tab.on .ic{background:rgba(47,93,58,.18);border-radius:14px}
.ic{width:46px;height:30px;display:grid;place-items:center}
.sortie{position:relative;z-index:1;justify-self:center;margin-top:-34px;width:78px;height:78px;border-radius:50%;background:linear-gradient(180deg,#E3C25C,#C9A22F);border:3px solid rgba(255,250,232,.85);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.6),0 2px 0 rgba(60,50,10,.3);display:grid;place-items:center;text-align:center;font:400 14px/1 var(--slab);color:var(--ink)}
.sortie svg{display:block;margin:0 auto 3px}

.top{position:absolute;left:72px;right:16px;top:62px;height:42px;display:flex;align-items:center}
.stage{position:absolute;left:24px;top:112px;width:300px;transform:rotate(2deg)}
.stage svg{width:300px;height:auto;display:block;overflow:visible;filter:drop-shadow(0 2px 0 rgba(0,0,0,.28))}
h1{position:absolute;left:20px;top:482px;font:400 26px/1.12 var(--slab);max-width:350px}
.info{position:absolute;left:20px;top:590px;display:grid;gap:7px;font-size:15px;font-weight:600}
.info div{display:flex;align-items:center;gap:10px}
.go{position:absolute;left:16px;right:16px;bottom:44px}
