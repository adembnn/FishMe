<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=393,initial-scale=1"><title>Carte des coins</title><style>
@font-face{font-family:'DM Serif Display';src:url('dm-serif-display-latin-400-normal.woff2') format('woff2');font-weight:400;font-display:block}
:root{--felt:#1F6B4F;--felt-d:#164F3A;--cream:#F6EBCF;--paper:#FBF3DC;--red:#C73E2E;--navy:#1B2A49;--gold:#E0A526;--water:#5FA8D8;--ink2:#46557A}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--felt)}
body{font-family:'DM Serif Display',Georgia,serif;color:var(--navy);-webkit-font-smoothing:antialiased}
.sys{font-family:-apple-system,'SF Pro Text','Helvetica Neue',Arial,sans-serif}
.glass{position:relative;isolation:isolate;background:rgba(255,250,235,.58);-webkit-backdrop-filter:blur(18px) saturate(1.7);backdrop-filter:blur(18px) saturate(1.7);border:1px solid rgba(255,255,255,.75);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 -1.5px 0 rgba(27,42,73,.14),0 10px 28px rgba(27,42,73,.26)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(160deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 38%);pointer-events:none;z-index:-1}

.sb{position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 40px;font-weight:600;font-size:17px;z-index:50}
.sb .isl{position:absolute;left:50%;top:11px;width:122px;height:36px;margin-left:-61px;background:#0b0f1a;border-radius:20px}
.sb .r{display:flex;gap:6px;align-items:center}

body{width:393px;height:852px;overflow:hidden;position:relative;background:#E9DDB8}
.scr{position:absolute;inset:0;overflow:hidden}
svg.map{position:absolute;left:0;top:0}
.num{font-family:'DM Serif Display',serif;font-size:13px;fill:#1B2A49}
.let{font-family:'DM Serif Display',serif;font-size:25px}
.com{font-family:'DM Serif Display',serif;font-size:13px;fill:#1B2A49;paint-order:stroke;stroke:#F6EBCF;stroke-width:4px;stroke-linejoin:round;opacity:.95}
.zone{font-family:'DM Serif Display',serif;font-size:15px;letter-spacing:.28em;fill:#F6EBCF;opacity:.7}
.riv{font-family:'DM Serif Display',serif;font-style:italic;font-size:13px;fill:#F6EBCF}
.halo{animation:halo 2.4s ease-in-out infinite}
@keyframes halo{50%{stroke-width:7;opacity:.7}}
.head{position:absolute;left:16px;right:16px;top:60px;height:58px;border-radius:29px;display:flex;align-items:center;gap:12px;padding:0 18px 0 12px;z-index:5}
.head .badge{width:38px;height:38px;border-radius:50%;background:var(--red);display:grid;place-items:center;border:2.5px solid var(--navy);flex:none}
.head h1{font-weight:400;font-size:19px;line-height:1.1}
.head p{font-size:13px;color:var(--ink2);margin-top:2px}
.sheet{position:absolute;left:12px;right:12px;top:596px;height:136px;background:rgba(255,248,228,.82);border-radius:30px;padding:16px 18px 0;z-index:5}
.sheet .top{display:flex;align-items:center;gap:12px}
.sheet h2{font-weight:400;font-size:19px;white-space:nowrap;line-height:1.15}
.sheet .sub{font-size:14px;color:var(--ink2);margin-top:2px}
.oct{width:46px;height:46px;flex:none}
.chips{display:flex;gap:8px;margin-top:12px}
.chip{display:flex;align-items:center;gap:6px;background:rgba(255,246,220,.85);border:2px solid var(--navy);border-radius:14px;padding:5px 10px 5px 6px;font-size:14px}
.go{position:absolute;right:16px;top:20px;background:var(--red);color:#FFF6DC;font-size:16px;padding:9px 18px;border-radius:20px;border:2.5px solid var(--navy);box-shadow:0 4px 0 var(--navy);}
.bar{position:absolute;left:14px;right:14px;top:760px;height:68px;border-radius:34px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:6}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;width:66px;color:var(--ink2)}
.tab.on{color:var(--navy)}
.tab.on svg{stroke:var(--red)}
.sortie{position:absolute;left:50%;top:-22px;margin-left:-37px;width:74px;height:74px;border-radius:50%;background:var(--red);border:3px solid var(--navy);box-shadow:0 5px 0 var(--navy),0 12px 20px rgba(27,42,73,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#FFF6DC;font-size:14px;gap:1px;z-index:2}
.tabs-l{display:flex}
.home{position:absolute;bottom:8px;left:50%;margin-left:-67px;width:134px;height:5px;border-radius:3px;background:var(--navy);opacity:.9;z-index:9}
.you{font-size:13px}
</style></head><body>
