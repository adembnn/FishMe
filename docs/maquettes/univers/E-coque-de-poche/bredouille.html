<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=393,initial-scale=1,viewport-fit=cover">
<title>Coque de poche, bredouille</title>
<link rel="stylesheet" href="shell.css">
<link rel="stylesheet" href="screens.css">
<style>.meta{display:inline-block;margin-top:12px;padding:8px 12px;border-radius:16px;background:rgba(255,255,255,.55);box-shadow:inset 0 1px 0 #fff;font:600 13px/1.25 var(--sys)}.egg .btns i{width:30px;height:30px}.table{z-index:0}</style>
</head>
<body>
<div class="phone ">
<div class="table"></div>
<div class="sb" data-time="18:55"></div>
<div class="egg translucent" id="egg" style="position:absolute;left:24px;top:88px;width:345px;height:566px;--ring:rgba(77,201,216,.55);background:linear-gradient(165deg,rgba(255,255,255,.5),rgba(255,255,255,.1) 45%),rgba(255,255,255,.28)">
 <div class="ring"></div><div class="inner" style="opacity:.5" id="inner"></div><div class="spec"></div>
 <div class="bezel" style="position:absolute;left:32px;top:112px;width:281px;padding:12px;border-radius:26px"><div class="lcd" style="width:257px;height:224px"><canvas id="cv"></canvas>
  <div class="px" style="left:8px;top:7px;font-size:18px;font-weight:600">SORTIE</div><div class="px" style="right:8px;top:7px;font-size:18px;font-weight:600">0 PRISE</div>
  <div class="px" style="left:8px;bottom:8px;font-size:14px;font-weight:600">12 OCT · 18H55</div></div></div>
 <div style="position:absolute;left:28px;right:28px;top:378px;text-align:center;color:var(--teal-ink)"><div style="font:600 20px/1.2 var(--sys)">Rien n'a mordu.</div><div style="font:500 15px/1.3 var(--sys);margin-top:3px">La sortie compte quand même.</div>
  <div class="meta">La Marne, Val-de-Marne (94)<br>12 oct. · 18 h 55 · 14 °C · lune 2 %</div></div>
 <div class="btns" style="top:518px"><i></i><i></i><i></i></div></div>
<div class="cta pink glass" style="top:690px">Ranger avec mes sorties</div>
<div class="home"></div>
</div>
<script src="sprites.js"></script>
<script src="lcd.js"></script>
<script src="app.js"></script>
<script>
document.getElementById('inner').innerHTML=E.board(345,566);
const L=new E.Lcd(document.getElementById('cv'),64,56,4);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const bob=["...##...","...##...","..####..",".######.",".#....#.","..####..","...##...","........"];
function f(){const ph=reduce?0:Math.floor(performance.now()/700)%2;L.clear();
 for(let y=24;y<50;y+=4)for(let x=(y*3+ph*2)%6;x<64;x+=6){L.set(x,y);L.set(x+1,y);L.set(x+2,y)}
 for(let x=0;x<64;x++)if(x%2===0)L.set(x,22);
 L.glyph(28,ph?13:14,bob);for(let y=8;y<14;y++)L.set(31,y); // fil
 [[44,10],[47,7],[50,4]].forEach(([x,y],i)=>{ // z z z
   L.set(x,y);L.set(x+1,y);L.set(x+2,y);L.set(x+1,y+1);L.set(x,y+2);L.set(x+1,y+2);L.set(x+2,y+2)});
 L.draw();if(!reduce)requestAnimationFrame(f)}
f();
</script>
</body>
</html>
