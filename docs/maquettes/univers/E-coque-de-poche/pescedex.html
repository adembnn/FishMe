<style>.st{flex:1;height:58px;border-radius:20px;padding:9px 14px;display:flex;flex-direction:column;justify-content:center;gap:5px;color:var(--teal-ink)}
.st b{font:600 13px/1 var(--sys)}.st span{font:600 20px/1 var(--px)}
.seg{position:absolute;left:16px;right:16px;top:204px;height:44px;border-radius:22px;display:flex;padding:4px;gap:4px;font:600 15px/1 var(--sys);color:var(--teal-ink)}
.seg div{flex:1;display:flex;align-items:center;justify-content:center;border-radius:18px}.seg .on{background:rgba(255,255,255,.65);box-shadow:inset 0 1px 0 #fff,0 1px 3px rgba(4,60,80,.25)}
.grid{position:absolute;left:16px;right:16px;top:268px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px 11px}
.mc{border-radius:22px;padding:7px 7px 8px;height:138px;position:relative;display:flex;flex-direction:column;align-items:center;gap:6px}
.ml{background:var(--lcd);border-radius:9px;padding:0;box-shadow:inset 0 0 0 2px rgba(30,36,26,.55);line-height:0}
.ml canvas{display:block}
.mn{font:600 13px/1.1 var(--sys);text-align:center;color:var(--teal-ink)}
.op{background:#F2ECDC;border:2.5px solid #1E241A}
.tr{background:linear-gradient(165deg,rgba(255,255,255,.5),rgba(255,255,255,.06) 40%),rgba(77,201,216,.7);border:2px solid rgba(255,255,255,.85);box-shadow:inset 0 2px 0 #fff,0 6px 12px rgba(4,60,80,.25)}
.gl{background:linear-gradient(165deg,rgba(255,255,255,.5),rgba(255,255,255,.06) 40%),rgba(255,111,168,.7);border:2px solid rgba(255,255,255,.85);box-shadow:inset 0 2px 0 #fff,0 6px 12px rgba(4,60,80,.25)}
.ch{background:linear-gradient(112deg,transparent 28%,rgba(255,255,255,.75) 42%,transparent 54%),linear-gradient(180deg,#FFF3B0 0,#E7B52B 14%,#7A560A 28%,#FFE58A 42%,#C89A1E 56%,#FFF7C8 66%,#8A640E 80%,#F5CB4A 100%);border:2.5px solid #5E4308;box-shadow:0 6px 12px rgba(60,40,0,.3)}
.ch .mn{background:rgba(255,250,224,.92);border-radius:8px;padding:3px 6px}
.op .mn,.tr .mn,.gl .mn{}
.un{background:rgba(255,255,255,.14);border:2px dashed rgba(5,48,58,.45)}
.un .ml{background:rgba(158,168,138,.55);box-shadow:none}
.un .mn{opacity:.8}</style>
