<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=393, initial-scale=1">
<title>Verdict</title><link rel="stylesheet" href="clay.css">
<style>
.tab{position:absolute;left:16px;right:16px;top:118px;height:610px;border-radius:44px;padding:14px;--c:var(--teal);--tr:var(--teal-d);--ep:10px}
.in{height:100%;border-radius:32px;--c:var(--cream);padding:20px 20px 0;position:relative}
.stamp{display:inline-block;padding:12px 24px;border-radius:30px;--c:var(--teal);--tr:var(--teal-d);--ep:6px;font-size:30px;font-weight:700;color:#1d0c03;text-shadow:0 1px 0 rgba(255,255,255,.35);transform:rotate(-2deg)}
.mini{width:268px;margin:20px auto 0}
.cap{font-size:44px;font-weight:700;line-height:1;margin-top:18px}.cap small{font-size:22px}
.cap em{font-style:normal;font-size:18px;font-weight:500;opacity:.85;margin-left:6px}
.regle{position:relative;margin-top:96px;height:30px;border-radius:15px;--c:#EAD9A6}
.zone-n{position:absolute;left:0;top:0;bottom:0;width:41%;border-radius:15px 0 0 15px;background:repeating-linear-gradient(135deg,rgba(184,68,26,.28) 0 5px,transparent 5px 10px)}
.reg-p{position:absolute;left:45.5%;top:-14px;width:5px;height:58px;border-radius:3px;background:#32190B}
.reg-l{position:absolute;left:45.5%;top:-52px;transform:translateX(-50%);font-size:14px;font-weight:700;white-space:nowrap}
.reg-b{position:absolute;left:52.7%;top:-4px;width:38px;height:38px;margin-left:-19px;border-radius:50%;--c:var(--orange);--tr:var(--orange-d);--ep:5px;z-index:2}
.reg-v{position:absolute;left:52.7%;top:44px;transform:translateX(-50%);font-size:14px;font-weight:700;color:var(--orange-d);white-space:nowrap}
.reg-t span{position:absolute;top:36px;font-size:13px;font-weight:500;opacity:.8}
.rules{margin-top:78px;font-size:17px;font-weight:700;line-height:1.5}
.rules div{display:flex;gap:10px;align-items:center}.rules i{flex:none;width:12px;height:12px;border-radius:50%;background:var(--teal);box-shadow:inset 1px 1px 2px rgba(255,255,255,.6),inset -1px -2px 2px rgba(0,60,58,.6)}
.src{margin-top:12px;font-size:13px;font-weight:500;opacity:.78}
</style></head>
<body class="table ec"><main class="ecran">
<div class="statut" data-h="17:43"></div>

<h1 class="page-titre">Verdict</h1>
<p class="page-sous" style="top:96px">Brochet · 68 cm</p>
<section class="tab pate" aria-label="Verdict : garder possible"><div class="in creux">
 <div class="stamp pate">Garder possible</div>
 <div class="mini fish" data-fish="brochet,peu"></div>
 <div class="cap">68 <small>cm</small><em>/ 60 cm mini</em></div>
 <div class="regle creux"><div class="zone-n"></div><span class="reg-p"></span><span class="reg-l">60 mini</span><span class="reg-b pate"></span><span class="reg-v">68</span><span class="reg-t"><span style="left:2px">10</span><span style="right:2px">120</span></span></div>
 <div class="rules"><div><i></i>Ouvert jusqu'au 25 janv.</div><div><i></i>2 brochets max par jour</div></div>
 <p class="src">Règle nationale, indicative</p>
</div></section>
<button class="bouton prim verre" style="top:752px">Voir ma carte</button>

<div class="indicateur"></div></main>
<script src="poisson.js"></script><script>Pate.defs()</script><script src="ui.js"></script>
</body></html>
