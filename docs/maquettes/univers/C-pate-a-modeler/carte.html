<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=393, initial-scale=1">
<title>Carte des coins de pêche</title>
<link rel="stylesheet" href="clay.css">
<style>
  body{width:393px;height:852px;overflow:hidden}
  .plan{position:absolute;inset:0;width:393px;height:852px}

  /* Pastille de lieu : couvercle de verre */
  .lieu{background-color:rgba(255,246,214,.55);position:absolute;left:16px;top:62px;height:44px;padding:0 18px 0 12px;border-radius:22px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;z-index:20;color:var(--ink)}
  .lieu svg{flex:none}

  /* Boutons-spots : boutons de pâte à deux trous */
  .spot{position:absolute;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;z-index:10;
    display:grid;place-items:center;font-weight:700;font-size:21px;color:#1d0c03;cursor:pointer}
  .spot::before{content:"";position:absolute;inset:6px;border-radius:50%;
    box-shadow:inset 2.5px 3px 4px rgba(50,15,0,.4),inset -2px -2.5px 3px rgba(255,255,255,.5)}
  .spot i{position:absolute;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:#2a1204;
    box-shadow:0 1px 0 rgba(255,255,255,.5),inset 1px 1.5px 1px rgba(0,0,0,.6)}
  .spot i:first-of-type{left:11px}.spot i:last-of-type{right:11px}
  .spot b{position:relative;font-weight:700;line-height:1;text-shadow:0 1px 0 rgba(255,255,255,.35)}
  .rose{--c:var(--pink);--tr:var(--pink-d)}
  .menthe{--c:var(--teal);--tr:var(--teal-d)}
  .spot.choisi{width:72px;height:72px;margin:-36px 0 0 -36px;--c:var(--orange);--tr:var(--orange-d);--ep:9px;font-size:28px;z-index:12;
    animation:tremble .5s steps(1,end) infinite}
  .spot.choisi::before{inset:8px}
  .spot.choisi i{width:7px;height:7px;margin-top:-3.5px}
  .spot.choisi i:first-of-type{left:13px}.spot.choisi i:last-of-type{right:13px}
  /* Stop motion : la pâte « bout » à 12 images par seconde, une pose toutes les 2 images */
  @keyframes tremble{0%{transform:rotate(-2.2deg) translate(0,0)}33.3%{transform:rotate(1.6deg) translate(1px,-1.5px)}66.6%{transform:rotate(-.6deg) translate(-1px,.5px)}}

  /* Fiche du coin sélectionné */
  .fiche{position:absolute;left:16px;right:16px;top:586px;height:132px;border-radius:30px;padding:16px 18px 0;z-index:20}
  .fiche h1{font-size:16.5px;line-height:1.2;font-weight:700;letter-spacing:-.1px;white-space:nowrap}
  .fiche .rang{display:flex;align-items:flex-end;gap:4px;margin-top:12px}
  .fiche .rang .m{width:74px;height:36px;margin-right:2px}
  .fiche .rang .m svg{width:100%;height:100%;overflow:visible}
  .fiche .aller{position:absolute;right:16px;bottom:16px;height:44px;padding:0 15px;border-radius:22px;font-weight:700;font-size:16px;color:var(--ink);
    background:linear-gradient(118deg,rgba(255,150,80,.95),rgba(255,122,61,.78) 55%,rgba(255,190,120,.9));
    box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.75),inset 2px 3px 4px rgba(255,255,255,.65),inset -2px -4px 6px rgba(160,50,0,.25),0 8px 16px rgba(120,40,0,.35)}

  /* Barre d'onglets */
  .onglets{position:absolute;left:16px;right:16px;top:734px;height:78px;border-radius:39px;z-index:20;display:grid;grid-template-columns:1fr 1fr 96px 1fr;align-items:center;justify-items:center;padding:0 6px}
  .onglets button{display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:500;font-size:13px;color:var(--ink);padding:6px 4px;border-radius:24px;min-width:64px;z-index:1}
  .onglets button.actif{font-weight:700}
  .onglets button.actif .ic{background:rgba(255,255,255,.65);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.9),0 3px 8px rgba(30,10,0,.18)}
  .ic{width:44px;height:30px;border-radius:15px;display:grid;place-items:center}
  .onglets .sortie{border-radius:50%;padding:0;min-width:0;flex-direction:row;position:relative;z-index:2;width:84px;height:84px;margin-top:-8px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;color:var(--ink);
    background:radial-gradient(circle at 32% 26%,rgba(255,226,190,.95),rgba(255,138,70,.9) 52%,rgba(255,110,40,.85));
    -webkit-backdrop-filter:blur(10px) saturate(1.5);backdrop-filter:blur(10px) saturate(1.5);
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.8),inset 3px 4px 6px rgba(255,255,255,.7),inset -4px -6px 9px rgba(160,50,0,.3),0 12px 20px rgba(120,40,0,.4)}
  .sortie span{display:flex;flex-direction:column;align-items:center;gap:1px}
  .onglets::after{display:none}
</style>
</head>
<body class="table">
<main class="ecran" aria-label="Carte des coins de pêche">

  <div class="statut"><span>17:10</span><div class="ile"></div>
    <span class="droite" aria-hidden="true">
      <svg width="19" height="12" viewBox="0 0 19 12" fill="#fff"><rect x="0" y="8" width="3.2" height="4" rx="1"/><rect x="5" y="5.5" width="3.2" height="6.5" rx="1"/><rect x="10" y="3" width="3.2" height="9" rx="1"/><rect x="15" y="0" width="3.2" height="12" rx="1"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M1.5 4.3a10 10 0 0 1 14 0"/><path d="M4 7a6.5 6.5 0 0 1 9 0"/><circle cx="8.5" cy="10" r="1" fill="#fff" stroke="none"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.8" fill="none" stroke="#fff" stroke-opacity=".6"/><rect x="2" y="2" width="20" height="9" rx="2.6" fill="#fff"/><path d="M25 4.5v4c.9-.3 1.6-1.1 1.6-2s-.7-1.7-1.6-2z" fill="#fff" fill-opacity=".6"/></svg>
    </span>
  </div>

  <!-- Le diorama : plateau, rivière de pâte bleue, collines, arbres -->
  <svg class="plan" viewBox="0 0 393 852" aria-hidden="true">
    <defs>
      <radialGradient id="gTerre" cx=".3" cy=".18" r=".95"><stop offset="0" stop-color="#FBE9B4"/><stop offset=".55" stop-color="#F3D88C"/><stop offset="1" stop-color="#DDB964"/></radialGradient>
      <radialGradient id="gEau" cx=".25" cy=".2" r=".9"><stop offset="0" stop-color="#6FC4EE"/><stop offset=".6" stop-color="#2F9ED6"/><stop offset="1" stop-color="#1D78AE"/></radialGradient>
      <radialGradient id="gRose" cx=".3" cy=".22" r=".85"><stop offset="0" stop-color="#FFB9CD"/><stop offset=".6" stop-color="#FF8FB0"/><stop offset="1" stop-color="#D8648A"/></radialGradient>
      <radialGradient id="gMenthe" cx=".3" cy=".22" r=".85"><stop offset="0" stop-color="#6ADBD3"/><stop offset=".6" stop-color="#2FB5B0"/><stop offset="1" stop-color="#17847F"/></radialGradient>
      <radialGradient id="gOrange" cx=".3" cy=".22" r=".85"><stop offset="0" stop-color="#FFB27E"/><stop offset=".6" stop-color="#FF7A3D"/><stop offset="1" stop-color="#C9501C"/></radialGradient>
      <radialGradient id="gBeurre" cx=".3" cy=".22" r=".85"><stop offset="0" stop-color="#FFEE9A"/><stop offset=".6" stop-color="#FFD84A"/><stop offset="1" stop-color="#D9A818"/></radialGradient>
      <path id="marne" d="M-30 212C60 160 148 186 168 262C188 336 112 356 146 422C182 492 296 436 326 520C342 566 380 586 430 592"/>
    </defs>

    <!-- tranche du plateau, puis dessus -->
    <rect x="12" y="116" width="369" height="740" rx="54" fill="#B98A3E"/>
    <rect x="12" y="102" width="369" height="740" rx="54" fill="url(#gTerre)" filter="url(#puff1)"/>
    <g opacity=".5">
      <image href="empreinte.svg" x="262" y="112" width="70" height="94" transform="rotate(24 297 159)"/>
      <image href="empreinte.svg" x="36" y="560" width="64" height="86" transform="rotate(-18 68 603)"/>
      <image href="empreinte.svg" x="210" y="590" width="60" height="80" transform="rotate(40 240 630)"/>
    </g>

    <!-- collines roses -->
    <g filter="url(#ombre)">
      <ellipse cx="58" cy="352" rx="50" ry="33" fill="url(#gRose)" filter="url(#puff1)"/>
      <ellipse cx="338" cy="168" rx="42" ry="26" fill="url(#gRose)" filter="url(#puff1)"/>
      <ellipse cx="346" cy="372" rx="34" ry="22" fill="url(#gRose)" filter="url(#puff1)"/>
    </g>
    <image href="empreinte.svg" x="36" y="324" width="40" height="54" opacity=".55" transform="rotate(-14 56 351)"/>
    <image href="empreinte.svg" x="322" y="150" width="30" height="40" opacity=".55" transform="rotate(20 337 170)"/>

    <!-- la Marne : un boudin de pâte bleue -->
    <g filter="url(#ombre)">
      <use href="#marne" fill="none" stroke="#1A6B9A" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" transform="translate(2 5)"/>
      <use href="#marne" fill="none" stroke="url(#gEau)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" filter="url(#puff2)"/>
    </g>
    <use href="#marne" fill="none" stroke="#fff" stroke-opacity=".38" stroke-width="2" stroke-linecap="round" stroke-dasharray="26 18 8 22" transform="translate(-5 -7)"/>
    <use href="#marne" fill="none" stroke="#14577f" stroke-opacity=".3" stroke-width="2" stroke-linecap="round" stroke-dasharray="14 26 30 14" transform="translate(5 7)"/>
    <image href="empreinte.svg" x="104" y="230" width="52" height="70" opacity=".5" transform="rotate(35 130 265)"/>
    <text font-family="DynaPuff" font-weight="700" font-size="15" fill="#E8F7FF" letter-spacing=".5"><textPath href="#marne" startOffset="9%"><tspan dy="5">La Marne</tspan></textPath></text>

    <!-- arbres : boules de pâte sur bâtonnets -->
    <g filter="url(#ombre)">
      <g><rect x="127" y="226" width="8" height="22" rx="4" fill="#9A5B2A" filter="url(#puff0)"/><circle cx="131" cy="216" r="19" fill="url(#gMenthe)" filter="url(#puff1)"/></g>
      <g><rect x="160" y="216" width="8" height="18" rx="4" fill="#9A5B2A" filter="url(#puff0)"/><circle cx="164" cy="207" r="14" fill="url(#gMenthe)" filter="url(#puff1)"/></g>
      <g><rect x="297" y="330" width="8" height="22" rx="4" fill="#9A5B2A" filter="url(#puff0)"/><circle cx="301" cy="320" r="18" fill="url(#gMenthe)" filter="url(#puff1)"/></g>
      <g><rect x="36" y="498" width="8" height="24" rx="4" fill="#9A5B2A" filter="url(#puff0)"/><circle cx="40" cy="488" r="20" fill="url(#gMenthe)" filter="url(#puff1)"/></g>
      <g><rect x="232" y="524" width="8" height="20" rx="4" fill="#9A5B2A" filter="url(#puff0)"/><circle cx="236" cy="514" r="16" fill="url(#gMenthe)" filter="url(#puff1)"/></g>
    </g>
    <!-- petit pont orange -->
    <g filter="url(#ombre)" transform="rotate(-62 233 456)">
      <rect x="205" y="441" width="56" height="30" rx="10" fill="url(#gOrange)" filter="url(#puff1)"/>
      <path d="M219 445v22M233 445v22M247 445v22" stroke="#7a2c08" stroke-opacity=".45" stroke-width="2" stroke-linecap="round"/>
    </g>
  </svg>

  <div class="lieu verre"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#32190B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 18s6-5.2 6-10a6 6 0 0 0-12 0c0 4.800 6 10 6 10z"/><circle cx="10" cy="8" r="2"/></svg>La Marne, Val-de-Marne (94)</div>

  <button class="spot pate rose" style="left:62px;top:284px" aria-label="Coin A"><i></i><b>A</b><i></i></button>
  <button class="spot pate menthe" style="left:304px;top:246px" aria-label="Coin C"><i></i><b>C</b><i></i></button>
  <button class="spot pate rose" style="left:84px;top:480px" aria-label="Coin D"><i></i><b>D</b><i></i></button>
  <button class="spot pate menthe" style="left:318px;top:444px" aria-label="Coin E"><i></i><b>E</b><i></i></button>
  <button class="spot pate choisi" style="left:218px;top:372px" aria-label="Coin B, sélectionné" aria-pressed="true"><i></i><b>B</b><i></i></button>

  <section class="fiche verre" aria-label="Fiche du coin B">
    <h1>Coin B · 2,4 km · 3 espèces relevées</h1>
    <div class="rang" id="mini"></div>
    <button class="aller" type="button">Y aller</button>
  </section>

  <nav class="onglets verre" aria-label="Navigation">
    <button class="actif" type="button"><span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#32190B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6.500v13L9 17l6 3 6-2.500v-13L15 7z"/><path d="M9 4v13M15 7v13"/></svg></span>Carte</button>
    <button type="button"><span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#32190B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3.500" width="16" height="17" rx="4"/><path d="M8 9h8M8 13h5"/></svg></span>Pescedex</button>
    <button class="sortie" type="button" aria-label="Sortie"><span><svg width="28" height="22" viewBox="0 0 28 22" fill="none" stroke="#32190B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15c3 2.500 6 2.500 9 0s6-2.500 9 0 4 1.500 4 1.500"/><path d="M14 13V3M14 3l-3 3.500M14 3l3 3.500"/></svg>Sortie</span></button>
    <button type="button"><span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#32190B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.500" r="4"/><path d="M4.500 20c.8-4 3.700-6 7.500-6s6.700 2 7.500 6"/></svg></span>Moi</button>
  </nav>
  <div class="indicateur"></div>
</main>
<script src="poisson.js"></script>
<script>
  Pate.defs();
  document.getElementById('mini').innerHTML = [['gardon','commun'],['brochet','peu'],['sandre','rare']]
    .map(([n,r]) => '<div class="m">' + Pate.poisson(n,r) + '</div>').join('');
</script>
</body>
</html>
