<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=393,initial-scale=1">
<title>Coins de pêche</title>
<style>
@font-face{font-family:'Fredoka';font-weight:500;font-display:block;src:url('fonts/fredoka-500.woff2') format('woff2')}
@font-face{font-family:'Fredoka';font-weight:600;font-display:block;src:url('fonts/fredoka-600.woff2') format('woff2')}
@font-face{font-family:'Fredoka';font-weight:700;font-display:block;src:url('fonts/fredoka-700.woff2') format('woff2')}

:root{
  --navy:#1F2D5C; --cream:#FFF7E0; --sun:#FFC83D; --sky:#3FB8E8; --sky-l:#8DDCFA;
  --grass:#7ED957; --coral:#FF5A4D; --leaf:#34A853;
  --glass-bg:rgba(255,255,255,.52); --glass-line:rgba(255,255,255,.85);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#BFE9FF}
body{font-family:'Fredoka',system-ui,sans-serif;font-weight:500;color:var(--navy);-webkit-font-smoothing:antialiased}
.glass{
  background:var(--glass-bg);
  -webkit-backdrop-filter:blur(16px) saturate(190%);backdrop-filter:blur(16px) saturate(190%);
  border:1.5px solid var(--glass-line);
  box-shadow:inset 0 2px 1px rgba(255,255,255,.95), inset 0 -2px 3px rgba(255,255,255,.35), inset 0 0 14px rgba(255,255,255,.35), 0 10px 24px rgba(31,45,92,.22);
}

.status{position:absolute;left:0;right:0;top:0;height:54px;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:6px 30px 0 44px}
.time{font-family:-apple-system,'SF Pro Text','Helvetica Neue',Arial,sans-serif;font-weight:600;font-size:17px;color:#0B1433;letter-spacing:-.2px}
.island{position:absolute;left:50%;top:11px;width:124px;height:36px;margin-left:-62px;background:#000;border-radius:20px}
.sys{display:flex;gap:6px;align-items:center}

html,body{width:393px;height:852px;overflow:hidden}
.phone{position:relative;width:393px;height:852px;overflow:hidden;background:#8BDF5C}
.map{position:absolute;inset:0;width:100%;height:100%}
.pin .bob{transform-box:fill-box;transform-origin:50% 100%}
.pin.sel .bob{animation:hop 1.1s ease-in-out infinite}
.ring{transform-origin:232px 409px;animation:ring 1.6s ease-out infinite}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}30%{transform:translateY(0) scale(1.08,.9)}60%{transform:translateY(-9px) scale(.96,1.06)}}
@keyframes ring{from{transform:scale(.6);opacity:1}to{transform:scale(1.9);opacity:0}}
@media (prefers-reduced-motion:reduce){.pin.sel .bob,.ring{animation:none}}
.where{position:absolute;left:16px;top:62px;height:44px;padding:0 16px 0 10px;border-radius:22px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;z-index:10}
.where svg{flex:none}
.round{position:absolute;right:16px;top:62px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;z-index:10}
.sheet{position:absolute;left:16px;right:16px;bottom:150px;border-radius:30px;padding:14px 14px 14px 16px;z-index:10;background:rgba(255,255,255,.8)}
.sheet h2{font-size:18px;font-weight:700;line-height:1.2;white-space:nowrap}
.sheet h2 span{color:#B35A00}
.sheet .rw{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.meds{display:flex;gap:8px;align-items:center}
.med{width:58px;height:46px;border-radius:23px;background:#8DDCFA;border:3.5px solid #1F2D5C;display:grid;place-items:center;overflow:hidden;box-shadow:0 3px 0 rgba(31,45,92,.85)}
.med .fish{width:46px;filter:none}
.go{height:46px;padding:0 22px;border-radius:23px;font-family:inherit;font-size:17px;font-weight:700;color:#1F2D5C;background:rgba(255,200,61,.8);border-color:rgba(255,255,255,.9);display:flex;align-items:center;gap:8px;box-shadow:inset 0 2px 1px rgba(255,255,255,.95),inset 0 -3px 4px rgba(255,255,255,.35),0 4px 0 #1F2D5C,0 10px 18px rgba(31,45,92,.2)}
.bar{position:absolute;left:16px;right:16px;bottom:26px;height:70px;border-radius:35px;display:flex;z-index:10}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:6px;gap:1px;font-size:13px;font-weight:700;border-radius:30px;margin:5px 0}
.tab.l1{width:78px;margin-left:6px;background:rgba(255,255,255,.6);box-shadow:inset 0 2px 1px rgba(255,255,255,.9),0 1px 3px rgba(31,45,92,.15)}
.tab.l2{width:84px;margin-left:4px}
.tab.r{margin-left:auto;margin-right:6px;width:84px}
.sortie{position:absolute;left:50%;margin-left:-37px;bottom:70px;width:74px;height:74px;border-radius:50%;z-index:12;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-family:inherit;font-weight:700;font-size:14px;color:#0F1838;background:rgba(255,100,88,.78);border-color:rgba(255,255,255,.9);box-shadow:inset 0 3px 2px rgba(255,255,255,.9),inset 0 -5px 8px rgba(255,255,255,.3),0 5px 0 #1F2D5C,0 12px 22px rgba(31,45,92,.3)}
.sortie::before{content:"";position:absolute;inset:-5px;border-radius:50%;border:4px solid #1F2D5C;z-index:-1;background:#fff0}
.hi{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:#0B1433;z-index:20}
