<!doctype html>

<title>Raretés du Pescedex</title>
<style>
@font-face{font-family:'Fredoka';font-weight:500;font-display:block;src:url('fonts/fredoka-500.woff2') format('woff2')}
@font-face{font-family:'Fredoka';font-weight:600;font-display:block;src:url('fonts/fredoka-600.woff2') format('woff2')}
@font-face{font-family:'Fredoka';font-weight:700;font-display:block;src:url('fonts/fredoka-700.woff2') format('woff2')}

:root{
  --navy:#1F2D5C; --cream:#FFF7E0; --sun:#FFC83D; --sky:#3FB8E8; --sky-l:#8DDCFA;
  --grass:#7ED957; --coral:#FF5A4D; --leaf:#34A853;
  --glass-bg:rgba(255,255,255,.52); --glass-line:rgba(255,255,255,.85);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#BFE9FF}
body{font-family:'Fredoka',system-ui,sans-serif;font-weight:500;color:var(--navy);-webkit-font-smoothing:antialiased}
.glass{
  background:var(--glass-bg);
  -webkit-backdrop-filter:blur(16px) saturate(190%);backdrop-filter:blur(16px) saturate(190%);
  border:1.5px solid var(--glass-line);
  box-shadow:inset 0 2px 1px rgba(255,255,255,.95), inset 0 -2px 3px rgba(255,255,255,.35), inset 0 0 14px rgba(255,255,255,.35), 0 10px 24px rgba(31,45,92,.22);
}

.card{position:relative;--p:9px;padding:var(--p);border-radius:30px;border:4px solid var(--navy);width:var(--w,300px);box-shadow:0 8px 0 rgba(31,45,92,.9),0 18px 28px rgba(31,45,92,.25)}
.card .in{background:var(--cream);border:4px solid var(--navy);border-radius:calc(30px - var(--p) + 2px);padding:12px 12px 12px;display:flex;flex-direction:column;gap:9px;position:relative}
.head{display:flex;justify-content:space-between;align-items:center}
.num{font-size:15px;font-weight:600;letter-spacing:.3px}
.rar{display:flex;align-items:center;gap:7px;font-weight:700;font-size:16px}
.badge{display:block;flex:none}
.scene{position:relative;height:var(--sh,170px);border-radius:18px;border:4px solid var(--navy);overflow:hidden;background:radial-gradient(120% 90% at 50% 115%,#B6ECFF 0,#5CC8F2 55%,#3FB8E8 100%)}
.scene::before{content:"";position:absolute;inset:0;background:var(--pat,none);opacity:var(--patO,.6)}
.scene .rip{position:absolute;left:50%;bottom:-18px;width:78%;height:46px;margin-left:-39%;border-radius:50%;border:4px solid rgba(255,255,255,.75)}
.scene .rip.b{width:100%;height:62px;margin-left:-50%;bottom:-30px;border-width:3px;opacity:.5}
.scene .fishwrap{position:absolute;left:5%;right:5%;top:50%;transform:translateY(-54%);display:flex;justify-content:center}
.fish{width:100%;height:auto;filter:drop-shadow(0 6px 0 rgba(31,45,92,.28))}
.stars{position:absolute;left:8px;top:8px;display:flex;gap:2px;padding:3px 7px 3px 5px;border-radius:14px;background:#fff;border:3px solid var(--navy)}
.st svg{display:block;width:19px;height:19px}
.st.on svg{fill:#FFC83D;stroke:#1F2D5C}
.st.off svg{fill:#E7E3D3;stroke:#B8B4A3;stroke-width:2}
.name{font-size:28px;font-weight:700;line-height:1.05;letter-spacing:.2px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:999px;border:3px solid var(--navy);background:#fff;font-weight:700;font-size:15px;line-height:1.3}
.fact{font-size:14px;font-weight:600;line-height:1.2}
/* rareté : matière du cadre qui grandit */
.r1{--p:9px;background:#D9B27A repeating-linear-gradient(90deg,rgba(90,50,10,.09) 0 2px,transparent 2px 10px);--pat:radial-gradient(rgba(255,255,255,.0) 1px,transparent 1px)}
.r2{--p:12px;background:linear-gradient(135deg,#F7FAFD,#A9B8CA 28%,#F0F5FA 50%,#8696AB 76%,#E8EEF5);--pat:radial-gradient(rgba(255,255,255,.7) 2.5px,transparent 3px);--patS:16px}
.r2 .scene::before{background-size:18px 18px}
.r3{--p:15px;background:linear-gradient(135deg,#FFE680,#F5A623 28%,#FFF2A8 50%,#D98A0B 76%,#FFD95E)}
.r3 .scene::before{background:repeating-conic-gradient(from 0deg at 50% 62%,rgba(255,255,255,.55) 0 8deg,transparent 8deg 20deg)}
.r4{--p:19px;background:conic-gradient(from 30deg,#FFD84D,#FF7AA8,#5FD8FF,#7CE38B,#FFD84D);box-shadow:0 8px 0 rgba(31,45,92,.9),0 0 0 6px rgba(255,255,255,.7),0 0 38px 10px rgba(255,214,77,.75)}
.r4 .scene::before{background:repeating-conic-gradient(from 0deg at 50% 62%,rgba(255,255,255,.7) 0 7deg,transparent 7deg 18deg)}
.stud{position:absolute;width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#C7D2E0 60%,#7C8DA5);border:2.5px solid var(--navy)}
.r3 .stud{background:radial-gradient(circle at 35% 30%,#FFF6C4,#FFC93C 60%,#C17F06)}
.r4 .stud{width:13px;height:13px;background:radial-gradient(circle at 35% 30%,#fff,#7FE4FF 55%,#FF7AA8)}
.stud.tl{left:calc(var(--p)/2 - 7px);top:calc(var(--p)/2 - 7px)}.stud.tr{right:calc(var(--p)/2 - 7px);top:calc(var(--p)/2 - 7px)}
.stud.bl{left:calc(var(--p)/2 - 7px);bottom:calc(var(--p)/2 - 7px)}.stud.br{right:calc(var(--p)/2 - 7px);bottom:calc(var(--p)/2 - 7px)}
.crown{position:absolute;left:50%;top:-40px;width:92px;margin-left:-46px;z-index:3;filter:drop-shadow(0 3px 0 rgba(31,45,92,.35))}
.ribbon{position:absolute;left:50%;top:-14px;transform:translateX(-50%);z-index:3;background:#FF8277;border:3.5px solid var(--navy);border-radius:10px;padding:1px 16px 2px;font-weight:700;font-size:14px;letter-spacing:.8px;color:var(--navy);box-shadow:0 3px 0 rgba(31,45,92,.9);white-space:nowrap}
.spark{position:absolute;width:26px;height:26px;z-index:4}

html,body{width:1600px;height:900px;overflow:hidden}
body{position:relative;background:linear-gradient(#72D0F8 0,#BDEBFF 62%,#FFF0B0 100%)}
.rays{position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% 82%,rgba(255,255,255,.28) 0 6deg,transparent 6deg 16deg)}
.hill{position:absolute;left:-100px;right:-100px;bottom:-130px;height:300px;border-radius:50%;background:#7ED957;border-top:6px solid #2F8F3A}
.hill.b{bottom:-190px;left:300px;right:-300px;background:#5FC24B}
h1{position:absolute;left:64px;top:44px;font-size:44px;font-weight:700;line-height:1}
.sub{position:absolute;left:66px;top:98px;font-size:20px;font-weight:600;max-width:640px;line-height:1.25}
.cloud{position:absolute;width:150px;height:56px;background:#fff;border:4px solid var(--navy);border-radius:40px}
.cloud::before{content:"";position:absolute;left:24px;top:-30px;width:62px;height:62px;border-radius:50%;background:#fff;border:4px solid var(--navy);border-bottom-color:transparent;border-right-color:#fff}
.row4{position:absolute;left:0;right:0;bottom:84px;display:flex;justify-content:center;align-items:flex-end;gap:26px}
figure{position:relative;zoom:1.04}
figure>i{position:absolute}
.s1{left:-30px;top:30px;width:34px}.s2{right:-14px;top:90px;width:26px}.s3{right:30px;top:-76px;width:30px}
.leg{position:absolute;left:0;right:0;bottom:28px;text-align:center;font-weight:600;font-size:18px}
.leg b{font-weight:700}
