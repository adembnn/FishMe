.sub{position:absolute;right:0;top:4px;font-family:var(--sys);font-weight:700;font-size:13px;line-height:15px;text-align:right;color:var(--ink)}
.sub i{display:block;font-style:normal;font-weight:600;opacity:.8}
.panel{position:absolute;background:var(--paper)}
.panel svg{position:absolute;left:0;top:0}
.panel.sel{box-shadow:5px 5px 0 var(--ink);z-index:3;transform:translate(-2px,-2px)}
.panel .cap{left:8px;top:8px;font-size:16px;padding:0 7px 1px}

.cap.on{background:var(--red);color:#fff}

.tabs{position:absolute;left:16px;right:16px;bottom:24px;height:70px;border-radius:35px;z-index:30;display:flex;justify-content:space-around;align-items:flex-end;padding:0 12px 7px}
.tab{width:96px;text-align:center;font-size:16px;line-height:18px;position:relative}
.tab svg{margin:0 auto 6px}
.tab.on:before{content:"";position:absolute;left:50%;top:-5px;width:50px;height:31px;margin-left:-25px;background:var(--yellow);border:3px solid var(--ink);border-radius:15px;z-index:-1}
.tab.on{z-index:1}
