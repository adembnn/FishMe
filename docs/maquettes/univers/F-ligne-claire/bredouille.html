<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=393,initial-scale=1"><title>Sortie sans prise</title><style>
@font-face{font-family:'Gochi Hand';src:url(gochi-hand-latin-400-normal.woff2) format('woff2');font-display:block}
:root{--ink:#15120E;--paper:#FBF1D6;--blue:#2D5DA8;--ocre:#E3B04B;--red:#D6402B;--yellow:#FFD23F;--green:#3E9B55;--sw:3px;
--hand:'Gochi Hand','Comic Sans MS',ui-rounded,sans-serif;--sys:-apple-system,'SF Pro Text',system-ui,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#cfc6ad}
body{font-family:var(--hand);color:var(--ink);-webkit-font-smoothing:antialiased}
.l{fill:none;stroke:var(--ink);stroke-width:var(--sw);stroke-linejoin:round;stroke-linecap:round}
svg{display:block;overflow:visible}
.phone{position:relative;width:393px;height:852px;margin:0 auto;overflow:hidden;background:var(--ocre)}
.status{position:absolute;left:0;right:0;top:0;height:54px;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:6px 34px 0 42px;font-family:var(--sys);font-weight:600;font-size:17px;letter-spacing:-.2px;color:var(--ink)}
.island{position:absolute;left:50%;top:11px;width:124px;height:36px;margin-left:-62px;background:#000;border-radius:20px;z-index:51}
.sicons{display:flex;gap:6px;align-items:center}
.home{position:absolute;left:50%;bottom:8px;width:136px;height:5px;margin-left:-68px;border-radius:3px;background:var(--ink);z-index:60}
.glass{background:linear-gradient(160deg,rgba(255,243,206,.62),rgba(235,190,90,.38));-webkit-backdrop-filter:blur(16px) saturate(1.7);backdrop-filter:blur(16px) saturate(1.7);
border:1.5px solid rgba(255,255,255,.75);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 -2px 0 rgba(180,120,20,.28),0 8px 22px rgba(21,18,14,.22)}
.cap{position:absolute;font-family:var(--hand);background:var(--yellow);border:var(--sw) solid var(--ink);padding:1px 8px 2px;font-size:19px;line-height:1.1;z-index:5}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important}}

.pn{position:absolute;background:var(--paper)}.fw{position:absolute;z-index:5}
.ghost{filter:grayscale(1) contrast(.5) brightness(1.5);opacity:.75}
.sq{display:inline-flex;gap:3px;vertical-align:middle}.sq i{display:block;width:10px;height:13px;border:2.5px solid var(--ink);background:var(--ink)}.sq i.o{background:transparent}
.tag{display:inline-block;background:var(--yellow);border:3px solid var(--ink);padding:0 9px 1px;font-size:18px;line-height:25px;white-space:nowrap}
.box{position:absolute;background:var(--paper);border:3px solid var(--ink)}
.t{font-size:22px;line-height:26px}.s{font-family:var(--sys);font-weight:600;font-size:13px;line-height:16px}
.btn{position:absolute;left:16px;right:16px;border-radius:30px;display:flex;align-items:center;justify-content:center;gap:10px;z-index:30;color:var(--ink)}
.bR{background:linear-gradient(170deg,#C93A25,#A52B1B);border:3px solid var(--ink);box-shadow:inset 0 2px 0 rgba(255,255,255,.7),0 4px 0 var(--ink);color:#fff}
.bY{background:linear-gradient(170deg,rgba(255,225,120,.92),rgba(235,175,50,.9));border:3px solid var(--ink);box-shadow:inset 0 2px 0 rgba(255,255,255,.85),0 4px 0 var(--ink)}
.ban{position:absolute;left:16px;top:60px;background:var(--paper);border:3px solid var(--ink);padding:0 14px 2px;font-size:27px;line-height:38px;height:44px;transform:rotate(-1.2deg);box-shadow:4px 4px 0 var(--ink);z-index:9}
.under{position:absolute;left:16px;right:16px;background:#2D5DA8;border:3px solid var(--ink)}
.x{position:absolute;right:16px;top:60px;width:44px;height:44px;border-radius:50%;z-index:40;display:grid;place-items:center}
.lnk{font-family:var(--sys);font-weight:600;font-size:15px;text-decoration:underline;text-underline-offset:3px;color:var(--ink)}
.tabs{position:absolute;left:16px;right:16px;bottom:24px;height:70px;border-radius:35px;z-index:30;display:flex;justify-content:space-around;align-items:flex-end;padding:0 12px 7px}
.tab{width:96px;text-align:center;font-size:16px;line-height:18px;position:relative}.tab svg{margin:0 auto 6px}
.tab.on:before{content:"";position:absolute;left:50%;top:-5px;width:50px;height:31px;margin-left:-25px;background:var(--yellow);border:3px solid var(--ink);border-radius:15px;z-index:-1}.tab.on{z-index:1}

 .stars svg{}
