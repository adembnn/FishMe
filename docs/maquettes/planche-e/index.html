<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=393, initial-scale=1, viewport-fit=cover">
<title>Étiquette de brochet</title>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<link rel="stylesheet" href="../assets/vendor/phosphor/regular/style.css">
<style>
:root{
  --paper:#FFFFFF;
  --ink:#14181B;
  --ink-2:#596168;
  --hair:#C9CED2;
  --accent:#1E7F4F;
  --sans:'Familjen Grotesk',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
  /* 3 text sizes for the whole screen */
  --t-name:28px; --t-body:15px; --t-small:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#E9EBEC}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;display:flex;justify-content:center}
::selection{background:var(--accent);color:#fff}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.screen{position:relative;width:393px;height:852px;overflow:hidden;background:var(--paper)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* iOS chrome */
.island{position:absolute;top:11px;left:50%;width:124px;height:36px;margin-left:-62px;background:#000;border-radius:20px;z-index:30}
.status{position:absolute;top:0;left:0;right:0;height:54px;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:6px 34px 0 50px;font:600 17px/1 -apple-system,"SF Pro Text",var(--sans);letter-spacing:-.01em}
.status .r{display:flex;gap:6px;align-items:center}
.home{position:absolute;bottom:8px;left:50%;width:136px;height:5px;margin-left:-68px;border-radius:3px;background:#0B0F14;z-index:30}

/* verdict: one line + a thin ruler */
.verdict{position:absolute;left:16px;right:16px;top:60px;z-index:10}
.vline{display:flex;align-items:center;gap:8px;height:44px;font-size:var(--t-body)}
.vline .ic{font-size:24px;color:var(--accent);flex:none}
.vline h1{font-size:var(--t-body);font-weight:600;color:var(--accent);letter-spacing:0}
.vline .m{margin-left:auto;font-family:var(--mono);font-size:var(--t-body);font-weight:400;font-variant-numeric:tabular-nums}
.info{width:44px;height:44px;margin-right:-12px;display:grid;place-items:center;color:var(--ink-2);font-size:20px;border-radius:22px}
.ruler{display:block;width:361px;height:34px;overflow:visible;margin-top:0}
.pop{position:absolute;left:0;right:0;top:112px;background:#fff;border:1px solid var(--hair);border-radius:6px;padding:12px 14px;font-size:var(--t-small);line-height:1.5;color:var(--ink);box-shadow:0 8px 24px rgba(20,24,27,.10);opacity:0;visibility:hidden;transform:translateY(-4px);transition:opacity .25s,transform .25s var(--ease),visibility .25s}
.pop.open{opacity:1;visibility:visible;transform:none}
.pop p+p{margin-top:2px}
.pop .fine{color:var(--ink-2);margin-top:8px}
.pop a{color:var(--accent);text-underline-offset:3px;text-decoration-thickness:1px}

/* specimen */
.fish{position:absolute;left:4px;top:196px;width:385px;height:115px;transform:rotate(-8deg);transform-origin:50% 50%}
.fish>img:first-child{display:block;width:100%;height:100%;filter:drop-shadow(0 14px 12px rgba(20,24,27,.13))}
.fish .sheen{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;filter:brightness(1.9) saturate(.6);opacity:.55;
  -webkit-mask-image:linear-gradient(100deg,transparent calc(var(--mx,64%) - 12%),#000 var(--mx,64%),transparent calc(var(--mx,64%) + 12%));
  mask-image:linear-gradient(100deg,transparent calc(var(--mx,64%) - 12%),#000 var(--mx,64%),transparent calc(var(--mx,64%) + 12%))}
.thread{position:absolute;left:0;top:0;width:393px;height:852px;pointer-events:none;overflow:visible}
.thread path{fill:none;stroke:var(--ink);stroke-width:.75;stroke-linecap:round}
.thread circle{fill:var(--ink)}

/* the label: a plain rectangle, tied by a thread */
.tagwrap{position:absolute;left:36px;top:456px;width:240px;height:156px;perspective:800px;transform-origin:28px 16px}
.tag{position:relative;display:block;width:100%;height:100%;text-align:left;transform-style:preserve-3d;transition:transform .7s var(--ease)}
.tag.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;background:#fff;border:1px solid var(--ink);border-radius:2px;padding:30px 16px 14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column}
.face.back{transform:rotateY(180deg);justify-content:flex-start;gap:8px;font-size:var(--t-body);line-height:1.35}
.hole{position:absolute;left:23px;top:11px;width:10px;height:10px;border:1px solid var(--ink);border-radius:50%;background:#fff}
.no{font-family:var(--mono);font-size:var(--t-body);color:var(--ink-2);line-height:1}
.nm{font-size:var(--t-name);font-weight:600;letter-spacing:-.02em;line-height:1.05;margin-top:6px}
.la{font-size:var(--t-body);font-style:italic;color:var(--ink-2);margin-top:2px}
.row{margin-top:auto;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--hair);padding-top:9px;font-size:var(--t-body)}
.row b{font-family:var(--mono);font-weight:600}
.pal{display:flex;align-items:center;gap:8px;color:var(--ink-2)}
.dots{display:flex;gap:3px}
.dots svg{width:10px;height:10px}
.back .k{color:var(--ink-2)}
.hint{position:absolute;left:36px;top:618px;width:240px;text-align:right;font-size:var(--t-small);color:var(--ink-2)}

.where{position:absolute;left:36px;right:36px;top:676px;font-size:var(--t-small);color:var(--ink-2)}
.release{position:absolute;left:50%;transform:translateX(-50%);top:712px;height:44px;padding:0 16px;display:flex;align-items:center;font-size:var(--t-small);color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}

/* controls: the only glass */
.bar{position:absolute;left:16px;right:16px;bottom:27px;height:62px;border-radius:31px;padding:6px;display:flex;gap:6px;z-index:15;
  background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);
  border:.5px solid rgba(20,24,27,.10);box-shadow:0 6px 20px rgba(20,24,27,.10)}
.btn{height:50px;border-radius:25px;font-size:var(--t-body);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .25s var(--ease),filter .25s}
.btn i{font-size:20px}
.btn:active{transform:scale(.97)}
.main{flex:1;background:var(--accent);color:#fff}
.main:hover{filter:brightness(1.08)}
.sec{width:128px;color:var(--ink)}
.sec:hover{background:rgba(20,24,27,.05)}
@media (prefers-reduced-motion:reduce){.tag{transition:none}.pop{transition:none}}
</style>
</head>
<body>
<main class="screen" id="screen">
  <div class="island"></div>
  <div class="status" aria-hidden="true">
    <span>9:41</span>
    <span class="r">
      <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="#0B0F14"/><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="#0B0F14"/><rect x="10" y="3" width="3" height="9" rx="1" fill="#0B0F14"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#0B0F14"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="#0B0F14" stroke-width="1.9" stroke-linecap="round"><path d="M1.2 4.3a10 10 0 0 1 14.6 0"/><path d="M3.9 7.1a6 6 0 0 1 9.2 0"/><circle cx="8.5" cy="10.2" r=".9" fill="#0B0F14"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.8" fill="none" stroke="#0B0F14" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2.4" fill="#0B0F14"/><path d="M25 4.5v4c.8-.3 1.5-1.1 1.5-2s-.7-1.7-1.5-2z" fill="#0B0F14" opacity=".45"/></svg>
    </span>
  </div>

  <section class="verdict" aria-label="Verdict">
    <div class="vline" id="vline">
      <i class="ph ph-seal-check ic" aria-hidden="true"></i>
      <h1>Garder possible</h1>
      <span class="m">68 / 60 cm mini</span>
      <button class="info" id="infoBtn" aria-expanded="false" aria-controls="pop" aria-label="Détail de la règle"><i class="ph ph-info"></i></button>
    </div>
    <svg class="ruler" id="ruler" viewBox="0 0 361 34" role="img" aria-label="Réglette : 68 cm, au-dessus du minimum de 60 cm"></svg>
    <div class="pop" id="pop" role="region" aria-label="Règle applicable">
      <p>Taille mini 60 cm, le tien : <b class="mono">68 cm</b>.</p>
      <p>Ouvert jusqu'au 25 janv. · 2 brochets max par jour.</p>
      <p class="fine">Règle nationale, indicative · <a href="#">Signaler une erreur</a></p>
    </div>
  </section>

  <div class="fish" id="fish">
    <img src="../assets/fish/brochet.png" alt="Brochet, 68 cm">
    <img class="sheen" id="sheen" src="../assets/fish/brochet.png" alt="">
  </div>


  <div class="tagwrap" id="tagwrap">
    <button class="tag" id="tag" aria-label="Étiquette du brochet, toucher pour la retourner" aria-pressed="false">
      <span class="face front">
        <span class="hole"></span>
        <span class="no">N° 014</span>
        <span class="nm">Brochet</span>
        <span class="la">Esox lucius</span>
        <span class="row"><b>68 cm</b>
          <span class="pal" role="img" aria-label="Palier 2 sur 3">
            <span class="dots" aria-hidden="true">
              <svg viewBox="0 0 10 10"><circle cx="5" cy="5" r="4.5" fill="#14181B"/></svg>
              <svg viewBox="0 0 10 10"><circle cx="5" cy="5" r="4.5" fill="#14181B"/></svg>
              <svg viewBox="0 0 10 10"><circle cx="5" cy="5" r="4" fill="none" stroke="#14181B" stroke-width="1"/></svg>
            </span>Palier 2 sur 3</span></span>
      </span>
      <span class="face back">
        <span class="hole"></span>
        <span>Commun en Seine-et-Marne, peu commun ici.</span>
        <span class="k">Relevés de l'OFB · 4 espèces sur les 11 relevées dans le 94.</span>
      </span>
    </button>
  </div>
  <svg class="thread" id="thread" viewBox="0 0 393 852" aria-hidden="true">
    <circle cx="200" cy="280" r="2" id="pin"/>
    <path id="wire" d="M200 280 C 196 350, 112 376, 65 472"/>
  </svg>
  <p class="hint" id="hint">Toucher pour retourner</p>

  <p class="where" id="where">12 oct. 2026 · 17 h 42 · La Marne, Val-de-Marne (94)</p>
  <a class="release" href="#" id="release">Je le relâche</a>

  <div class="bar" id="bar">
    <button class="btn main"><i class="ph ph-books"></i>Ranger dans le Pescedex</button>
    <button class="btn sec"><i class="ph ph-export"></i>Partager</button>
  </div>
  <div class="home"></div>
</main>

<script src="../assets/vendor/gsap/gsap.min.js"></script>
<script>
(function(){
  const NS='http://www.w3.org/2000/svg';
  const $=s=>document.querySelector(s);
  function el(n,a,p){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}

  /* ruler 0..80 cm, minimum 60, catch 68 : one hairline, no fill */
  const R=$('#ruler'),X=c=>c*361/80,Y=12;
  el('path',{d:`M0 ${Y}H${X(60)}`,stroke:'#14181B','stroke-opacity':.35,'stroke-width':1},R);
  el('path',{id:'okseg',d:`M${X(60)} ${Y}H${X(80)}`,stroke:'#1E7F4F','stroke-width':2.5},R);
  for(let c=0;c<=80;c+=10){const big=c%20===0||c===60;
    el('path',{d:`M${Math.min(Math.max(X(c),.5),360.5)} ${Y}v${big?7:4}`,stroke:'#14181B','stroke-opacity':c>=60?.9:.45,'stroke-width':1},R);}
  [[0,'0','start'],[20,'20','middle'],[40,'40','middle'],[60,'60 mini','middle'],[80,'80','end']].forEach(a=>{
    const t=el('text',{x:X(a[0]),y:32,'text-anchor':a[2],'font-family':'IBM Plex Mono','font-size':12,fill:a[0]===60?'#14181B':'#596168'},R);t.textContent=a[1];});
  const mk=el('g',{id:'mk'},R);
  el('path',{d:`M${X(68)} ${Y-1.5}l-4 -7h8z`,fill:'#1E7F4F'},mk);

  /* info popover */
  const btn=$('#infoBtn'),pop=$('#pop');
  btn.addEventListener('click',()=>{const o=pop.classList.toggle('open');btn.setAttribute('aria-expanded',o)});
  /* label flip */
  const tag=$('#tag'),hint=$('#hint');
  tag.addEventListener('click',()=>{const f=tag.classList.toggle('flip');tag.setAttribute('aria-pressed',f);hint.textContent=f?'Toucher pour revenir':'Toucher pour retourner'});

  const rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const wire=$('#wire'),len=wire.getTotalLength();
  if(window.gsap){
    if(rm){
      gsap.from('#fish,#thread,#tagwrap,.verdict,.where,.release,.hint,#bar',{opacity:0,duration:.6,ease:'none'});
    }else{
      /* the one authored moment: the thread draws from the fish to the label, the label settles */
      const tl=gsap.timeline({defaults:{ease:'expo.out'}});
      tl.from('#fish',{opacity:0,y:-10,duration:.7},0)
        .from('.verdict',{opacity:0,duration:.5,ease:'none'},.1)
        .from('#pin',{scale:0,transformOrigin:'50% 50%',duration:.3},.6)
        .fromTo(wire,{strokeDasharray:len,strokeDashoffset:len},{strokeDashoffset:0,duration:.9,ease:'power2.inOut'},.7)
        .from('#tagwrap',{opacity:0,rotation:5,duration:.9},1.4)
        .from(['.hint','.where','.release'],{opacity:0,duration:.5,ease:'none',stagger:.08},1.7)
        .from('#bar',{opacity:0,y:14,duration:.5},1.8);
    }
  }

  /* the single light effect: a soft band across the specimen, follows the pointer; resting state is already placed */
  if(!rm){
    const s=$('#screen'),sh=$('#sheen');
    s.addEventListener('pointermove',e=>{const r=$('#fish').getBoundingClientRect();
      const p=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));sh.style.setProperty('--mx',(p*100)+'%')});
  }
})();
</script>
</body>
</html>
