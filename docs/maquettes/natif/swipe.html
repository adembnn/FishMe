<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=393"><title>FishMe - Swipe</title>
<link rel="stylesheet" href="natif.css">
<style>
body{position:relative;background:linear-gradient(180deg,#F7F9FC,var(--fond))}
.tete{position:absolute;top:66px;left:24px;right:24px;display:flex;align-items:center;justify-content:space-between}
.tete h1{font:900 22px/1.1 var(--police);letter-spacing:-.01em}
.tete small{display:block;font:700 13px/1.2 var(--police);color:var(--encre-douce);margin-top:3px}
.compte{min-width:64px;height:36px;padding:0 14px;border-radius:999px;display:grid;place-items:center;font:900 16px/1 var(--police);color:var(--marine);background:rgba(255,255,255,.72);backdrop-filter:blur(20px);box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 2px 10px rgba(13,74,133,.12)}
.barre{position:absolute;top:124px;left:24px;right:24px;height:5px;border-radius:3px;background:var(--filet)}
.barre i{display:block;width:25%;height:100%;border-radius:3px;background:var(--marine)}
.pile{position:absolute;left:0;right:0;top:162px;height:470px}
.carte{position:absolute;left:50%;top:0;width:288px;height:417px;margin-left:-144px;border-radius:30px;overflow:hidden;background:linear-gradient(170deg,var(--eau-claire),var(--marine-doux));box-shadow:0 14px 34px rgba(8,42,76,.16),0 2px 6px rgba(8,42,76,.08)}
.carte img{position:absolute;left:50%;top:150px;width:272px;margin-left:-136px;filter:drop-shadow(0 8px 10px rgba(8,42,76,.18))}
.carte .nom{position:absolute;left:22px;bottom:22px;font:900 32px/1 var(--police);color:var(--nuit);letter-spacing:-.015em}
.carte .badge{position:absolute;top:18px;right:18px;width:34px;height:34px;font-size:15px}
.c3{transform:translateY(44px) scale(.86);opacity:.6}
.c2{transform:translateY(22px) scale(.93);opacity:.85}
.c3 img,.c2 img{display:none;top:165px;width:280px;margin-left:-140px}
.c1{transform:translateX(12px) rotate(5deg);transform-origin:50% 110%;z-index:5;box-shadow:0 22px 40px rgba(8,42,76,.22),0 2px 6px rgba(8,42,76,.1)}
.c3 .nom,.c2 .nom{opacity:0}
.c1 img{top:165px;width:280px;margin-left:-140px}
.stamp{position:absolute;top:40px;left:20px;transform:rotate(-12deg);padding:7px 14px 6px;border:4px solid var(--ouvert);border-radius:14px;color:var(--ouvert);font:900 22px/1 var(--police);letter-spacing:.03em;background:rgba(255,255,255,.55);text-transform:uppercase}
.actions{position:absolute;left:0;right:0;top:656px;display:flex;justify-content:center;gap:44px;align-items:flex-start}
.act{display:flex;flex-direction:column;align-items:center;gap:8px;font:800 13px/1 var(--police);color:var(--encre-douce)}
.rond{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.78);backdrop-filter:blur(24px);box-shadow:0 1px 0 #fff inset,0 6px 18px rgba(8,42,76,.14),0 0 0 1px rgba(13,74,133,.06)}
.rond svg{width:32px;height:32px;fill:none;stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round}
.non svg{stroke:var(--encre-douce)}
.oui{background:var(--marine);box-shadow:0 8px 20px rgba(13,74,133,.35)}
.oui svg{stroke:#fff}
.act.d{color:var(--marine)}
</style></head><body>
<div class="statut"><span>9:41</span><span></span></div><div class="ilot"></div>
<div class="tete"><div><h1>Tu as déjà pêché&nbsp;?</h1><small>Autour de Lyon</small></div><div class="compte">3 / 12</div></div>
<div class="barre"><i></i></div>
<div class="pile">
 <div class="carte c3"><img src="img/gardon.webp" alt=""></div>
 <div class="carte c2"><img src="img/perche.webp" alt=""></div>
 <div class="carte c1"><img src="img/brochet.webp" alt=""><span class="badge pc">·</span><div class="stamp">Déjà pêché</div><div class="nom">Brochet</div></div>
</div>
<div class="actions">
 <div class="act"><button class="rond non" aria-label="Jamais pêché"><svg viewBox="0 0 32 32"><path d="M8 8l16 16M24 8L8 24"/></svg></button>Jamais</div>
 <div class="act d"><button class="rond oui" aria-label="Déjà pêché"><svg viewBox="0 0 32 32"><path d="M6 17l7 7L26 9"/></svg></button>Déjà</div>
</div>
<div class="accueil"></div>
</body></html>
