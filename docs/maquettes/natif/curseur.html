<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=393"><title>FishMe - Taille au curseur</title>
<link rel="stylesheet" href="natif.css">
<style>
body{position:relative;font-variant-numeric:tabular-nums;background:linear-gradient(180deg,#F7F9FC,var(--fond))}
.verre{position:absolute;display:grid;place-items:center;background:rgba(255,255,255,.72);backdrop-filter:blur(20px);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 2px 10px rgba(13,74,133,.12);color:var(--marine);z-index:20}
.retour{left:16px;top:62px;width:44px;height:44px;border-radius:50%}
.titre{left:50%;top:62px;height:44px;width:90px;margin-left:-45px;border-radius:999px;font:900 17px/1 var(--police);color:var(--encre)}
.scene{position:absolute;left:16px;right:16px;top:126px;height:188px;border-radius:28px;background:linear-gradient(170deg,var(--eau-claire),var(--marine-doux));overflow:hidden}
.scene img{position:absolute;left:50%;top:38px;width:237px;margin-left:-118px;filter:drop-shadow(0 8px 8px rgba(8,42,76,.2))}
.cote{position:absolute;left:50%;width:237px;margin-left:-118px;top:140px;height:14px}
.cote i{position:absolute;left:0;right:0;top:6px;height:2.5px;border-radius:2px;background:var(--marine);opacity:.55}
.cote b{position:absolute;top:0;width:2.5px;height:14px;border-radius:2px;background:var(--marine);opacity:.55}
.grand{position:absolute;left:0;right:0;top:330px;text-align:center;font:900 132px/1 var(--police);letter-spacing:-.035em;color:var(--nuit)}
.grand small{font-size:48px;font-weight:800;color:var(--marine);margin-left:6px;letter-spacing:0}
.poids{position:absolute;left:0;right:0;top:482px;display:flex;justify-content:center;align-items:center;gap:10px;font:900 26px/1 var(--police);color:var(--nuit)}
.poids .est{height:32px;padding:0 14px;display:flex;align-items:center;border-radius:999px;background:var(--marine-doux);color:var(--marine);font:800 14px/1 var(--police)}
.regle{position:absolute;left:24px;right:24px;top:560px;height:112px}
.regle svg{position:absolute;left:0;top:0}
.pouce{position:absolute;top:0;width:48px;height:48px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px rgba(8,42,76,.08),0 4px 14px rgba(8,42,76,.25),0 1px 3px rgba(8,42,76,.2);display:grid;place-items:center}
.pouce::after{content:"";width:4px;height:20px;border-radius:2px;background:var(--marine)}
.ok{position:absolute;left:24px;right:24px;top:722px}
.ok .btn{min-height:56px;font-size:18px}
</style></head><body>
<div class="statut"><span>9:41</span><span style="display:flex;gap:6px;align-items:center"><svg width="18" height="12" viewBox="0 0 18 12" fill="#0E1A26"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg width="26" height="13" viewBox="0 0 26 13"><rect x=".5" y=".5" width="22" height="12" rx="3.5" fill="none" stroke="#0E1A26" opacity=".45"/><rect x="2" y="2" width="19" height="9" rx="2.2" fill="#0E1A26"/><rect x="24" y="4.5" width="1.6" height="4" rx=".8" fill="#0E1A26" opacity=".5"/></svg></span></div><div class="ilot"></div>
<button class="verre retour" aria-label="Retour"><svg width="12" height="20" viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 2 10l8 8"/></svg></button>
<div class="verre titre">Taille</div>

<div class="scene"><img src="img/brochet.webp" alt="Brochet"><div class="cote"><b style="left:0"></b><i></i><b style="right:0"></b></div></div>
<div class="grand">48<small>cm</small></div>
<div class="poids">≈ 1,1 kg<span class="est">estimé</span></div>

<div class="regle" id="regle"><svg id="sv" width="345" height="112" viewBox="0 0 345 112"></svg><div class="pouce" id="p"></div></div>
<div class="ok"><button class="btn principal">Valider</button></div>
<div class="accueil"></div>
<script>
// curseur : 10 a 80 cm sur 345 px (largeur utile 297 pour garder le pouce dans la piste)
var min=10,max=80,pad=24,W=345,u=(W-2*pad)/(max-min),val=48,cx=pad+(val-min)*u,h='';
h+='<rect x="0" y="14" width="345" height="20" rx="10" fill="#DCE3EB"/>';
h+='<rect x="0" y="14" width="'+(cx)+'" height="20" rx="10" fill="#0D4A85"/>';
for(var c=min;c<=max;c++){var x=pad+(c-min)*u,L=c%10==0?20:(c%5==0?14:8);
 h+='<line x1="'+x.toFixed(1)+'" y1="'+(46)+'" x2="'+x.toFixed(1)+'" y2="'+(46+L)+'" stroke="'+(c<=val?'#0D4A85':'#8FA0B3')+'" stroke-width="'+(c%10==0?2.2:1.4)+'" stroke-linecap="round"/>';
 if(c%10==0)h+='<text x="'+x.toFixed(1)+'" y="100" text-anchor="middle" font-family="Nunito,sans-serif" font-weight="800" font-size="15" fill="#566576">'+c+'</text>';}
document.getElementById('sv').innerHTML=h;
document.getElementById('p').style.left=(cx-24)+'px';
document.getElementById('p').style.top='0px';
</script>
</body></html>
