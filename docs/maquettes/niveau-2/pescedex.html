<style>.t1{position:absolute;top:56px;left:20px;font:900 34px/1.1 var(--f);letter-spacing:-.5px}

.st{position:absolute;top:124px;left:16px;right:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st div{background:var(--paper);border-radius:20px;padding:9px 12px 10px;box-shadow:0 8px 18px -10px rgba(5,50,80,.45)}

.seg .on{background:rgba(255,255,255,.88);box-shadow:inset 0 2px 1px #fff,0 1px 3px rgba(6,56,77,.2)}
.grid{position:absolute;top:248px;left:16px;right:16px;bottom:0;overflow:auto;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:116px;gap:8px;padding:0 0 130px;align-content:start}
.mc{background:var(--paper);border-radius:20px;padding:6px 6px 5px;box-shadow:0 8px 16px -10px rgba(5,50,80,.5);display:flex;flex-direction:column;align-items:center}
.mc .ma{width:100%;height:68px;border-radius:15px;display:grid;place-items:center;overflow:hidden}
.mc .ma img{width:80px;height:auto;max-height:50px;object-fit:contain}
.mc .fishimg{filter:drop-shadow(0 0 5px rgba(255,255,255,.8)) drop-shadow(0 4px 3px rgba(5,60,90,.4))}
.t-leg .fishimg{filter:drop-shadow(0 0 6px rgba(255,214,120,.7)) drop-shadow(0 4px 3px rgba(0,0,0,.5))}
.mc b{font:900 14px/1 var(--f);margin-top:7px;color:var(--navy)}
.mc .dots{margin-top:5px}
.mc.leg{box-shadow:0 0 0 3px #F2B63A,0 8px 16px -10px rgba(5,50,80,.5)}
.mc.sil .ma{background:#DCE8EE}.mc.sil .ma img{width:76px;max-height:46px;filter:none}.mc.sil b{color:#37596B;font-weight:800}
.mc.sil{background:#EEF6F9;box-shadow:inset 0 0 0 2px #CFE0E8}
</style></head>
