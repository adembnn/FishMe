<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les quatre raretés</title>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<link rel="stylesheet" href="../assets/vendor/phosphor/regular/style.css">
<style>
:root{--page:#F1F4F3;--ink:#14181B;--ink-2:#566067;--hair:#C9CED2;--accent:#1B6B5E;
 --disp:'Bricolage Grotesque',system-ui,sans-serif;--sans:'Hanken Grotesk',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--page)}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
::selection{background:var(--accent);color:#fff}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
/* ---------- la carte : une toise verticale 361 x 552 ---------- */
.stage{position:relative;width:361px;height:552px;perspective:1100px}
.card{position:absolute;inset:0;--px:62;--py:38;--acc:#1B6B5E;--ink:#14201D;--tick:#14201D;--tickhi:rgba(255,255,255,.75);
  --butt:#17493F;--butt-ink:#F2F7F5;--plate:rgba(255,255,255,.38);
  border-radius:16px;
  box-shadow:0 1px 1px rgba(10,24,20,.28),0 14px 24px -10px rgba(10,24,20,.38),0 28px 40px -24px rgba(10,24,20,.30);
  transform:rotateY(calc((var(--px) - 50) * .08deg)) rotateX(calc((50 - var(--py)) * .08deg));
  transition:transform .4s var(--ease)}
.face{position:absolute;inset:0;border-radius:16px;overflow:hidden;background:var(--face-bg);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -1px 0 rgba(10,24,20,.22)}
.butt{position:absolute;left:0;right:0;top:0;height:84px;background:var(--butt-bg,var(--butt));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -2px 0 rgba(0,0,0,.35),inset 0 -3px 0 rgba(255,255,255,.12)}
.lip{position:absolute;left:0;right:0;top:84px;height:22px;background:linear-gradient(rgba(8,20,16,.30),rgba(8,20,16,0))}
.rail{position:absolute;left:0;top:0;width:361px;height:552px;overflow:visible}
.rail text{font-family:var(--mono);font-size:12px;fill:var(--ink);font-variant-numeric:tabular-nums}
.plate{position:absolute;left:0;right:0;bottom:0;height:84px;background:var(--plate);box-shadow:inset 0 1px 0 rgba(10,24,20,.14),inset 0 2px 0 rgba(255,255,255,.55)}
.nom{position:absolute;left:18px;top:13px;font:700 30px/1.05 var(--disp);letter-spacing:-.01em;color:var(--butt-ink);z-index:6}
.lat{position:absolute;left:18px;top:50px;font:italic 400 12px/1 var(--sans);color:var(--butt-ink);opacity:.82;z-index:6}
.taille{position:absolute;right:18px;top:13px;z-index:6;color:var(--butt-ink);display:flex;align-items:baseline;gap:4px;font:700 32px/1.05 var(--disp);font-variant-numeric:tabular-nums}
.taille small{font:600 15px/1 var(--sans);opacity:.85}
.info{position:absolute;left:18px;right:18px;bottom:46px;z-index:6;font:600 15px/1.2 var(--sans);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot{position:absolute;left:18px;right:18px;bottom:12px;height:26px;z-index:6;display:flex;align-items:center;gap:8px;font:400 12px/1 var(--sans);color:var(--ink)}
.foot svg{width:22px;height:22px;flex:none}
.foot .no{margin-left:auto;font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums}

/* plan du poisson : ombre de contact + ombre longue, +8 % de contraste */
.fishwrap{position:absolute;inset:0;z-index:3;pointer-events:none;
  transform:translate(calc((var(--px) - 50) * .12px),calc((var(--py) - 50) * .05px));
  filter:contrast(1.08) saturate(1.05) drop-shadow(0 1.5px 1.5px rgba(8,24,20,.40)) drop-shadow(9px 16px 11px rgba(8,24,20,.24))}
.fishwrap img,.fishwrap .nacre{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none}
.fishwrap img.rim{filter:brightness(0) invert(1);opacity:.9}
/* plan avant : le curseur de la toise */
.cursor{position:absolute;left:0;right:0;height:0;z-index:5;pointer-events:none}
.cursor .line{position:absolute;left:0;right:0;top:-.75px;height:1.5px;background:var(--acc);box-shadow:0 1px 0 rgba(255,255,255,.55)}
.cursor .glint{position:absolute;left:0;right:0;top:0;height:16px;background:linear-gradient(rgba(255,255,255,.34),rgba(255,255,255,0))}
.cursor .tab{position:absolute;left:0;top:-10px;height:20px;min-width:40px;padding:0 8px 0 10px;display:flex;align-items:center;border-radius:0 5px 5px 0;background:var(--acc);color:#fff;
  font:600 12px/1 var(--mono);font-variant-numeric:tabular-nums;box-shadow:0 2px 4px rgba(8,24,20,.3);
  transform:translateX(calc((var(--px) - 50) * .14px))}
.cursor .tab b{font-weight:600}

/* reflets : un seul calque par matière */
.gloss{position:absolute;inset:0;border-radius:16px;overflow:hidden;z-index:4;pointer-events:none;display:none}

/* 1. commun, plomb : papier mat, aucun reflet */
.card[data-r=commun]{--face-bg:#E2E7E5;--butt:#34403D;--plate:rgba(255,255,255,.34);transform:none;--acc:#2D5F56}
.card[data-r=commun] .face::after{content:"";position:absolute;inset:0;opacity:.55;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .38 0 0 0 0 .44 0 0 0 0 .42 0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.card[data-r=commun] .fishwrap{transform:none}
.card[data-r=commun] .cursor .tab{transform:none}

/* 2. peu commun, bouchon : nacre sur l'illustration seule, <= 0,35 */
.card[data-r=peu]{--face-bg:linear-gradient(172deg,#EBF3F1 0%,#D5E3E0 100%)}
.nacre{--k:.33;opacity:var(--k);mix-blend-mode:color-dodge;
  background:
   repeating-conic-gradient(from 20deg at 50% 50%,rgba(255,255,255,.95) 0 4deg,rgba(255,255,255,0) 4deg 27deg) 0 0/11px 8px,
   linear-gradient(115deg,#8fe3ff 0%,#fff0cc 16%,#bdf7dc 33%,#ffd7ea 50%,#a9d8ff 66%,#fff0cc 83%,#8fe3ff 100%) 0 0/320% 320%;
  background-position:0 0,calc(var(--py) * 1%) calc(var(--px) * 1%);
  filter:saturate(.8)}

/* 3. rare, cuiller : chrome miroir sur toute la carte */
.card[data-r=rare]{--ink:#0C1317;--tick:#0C1317;--butt-bg:linear-gradient(100deg,#20282D 0 30%,#3A454C 30% 34%,#161D21 34% 70%,#313C43 70% 73%,#1A2125 73%);--butt-ink:#F4F8FA;--plate:rgba(244,248,250,.8);--acc:#0F5B8A;
  --face-bg:
   repeating-linear-gradient(15deg,rgba(255,255,255,.20) 0 1px,rgba(10,20,26,.06) 1px 2px),
   linear-gradient(100deg,#A3AEB5 0 8%,#F8FAFB 8% 19%,#B3BDC3 19% 27%,#FDFEFE 27% 38%,#93A0A8 38% 47%,#E6ECEF 47% 59%,#A2ADB4 59% 71%,#F5F8F9 71% 84%,#98A4AB 84% 100%) 0 0/230% 100%}
.card[data-r=rare] .face{background-position:0 0,calc(var(--px) * 1%) 0}
.card[data-r=rare] .gloss,.card[data-r=legende] .gloss{display:block}
.card[data-r=rare] .gloss::before{content:"";position:absolute;inset:0;mix-blend-mode:color-dodge;opacity:.42;
  background:repeating-linear-gradient(105deg,rgba(255,70,130,.55) 0 1px,rgba(255,215,70,.55) 1px 2px,rgba(70,255,170,.55) 2px 3px,rgba(70,170,255,.55) 3px 4px,transparent 4px 10px);
  background-position:calc(var(--px) * 1.2px) 0;
  -webkit-mask-image:radial-gradient(60% 70% at calc(var(--px) * 1%) calc(var(--py) * 1%),#000,rgba(0,0,0,.08));mask-image:radial-gradient(60% 70% at calc(var(--px) * 1%) calc(var(--py) * 1%),#000,rgba(0,0,0,.08))}
.card[data-r=rare] .gloss::after{content:"";position:absolute;inset:0;mix-blend-mode:soft-light;
  background:linear-gradient(105deg,transparent calc(var(--px) * 1% - 14%),rgba(255,255,255,.85) calc(var(--px) * 1% - 6%),rgba(255,255,255,.1) calc(var(--px) * 1% + 6%),transparent calc(var(--px) * 1% + 16%))}

/* 4. legendaire, mouche : or chaud, le poisson sort du cadre, lumiere permanente */
.card[data-r=legende]{--ink:#241808;--tick:#241808;--butt-bg:linear-gradient(100deg,#2B1F0A 0 28%,#4A3813 28% 32%,#241A08 32% 66%,#43330F 66% 69%,#2A1E09 69%);--butt-ink:#FBE9B0;--plate:rgba(255,246,214,.74);--acc:#7A4E00;
  --face-bg:
   repeating-linear-gradient(15deg,rgba(255,250,220,.22) 0 1px,rgba(80,50,0,.07) 1px 2px),
   linear-gradient(100deg,#D2A540 0 9%,#FFF1BF 9% 20%,#E3B954 20% 29%,#FFF8D6 29% 39%,#C79A33 39% 48%,#F6DD8C 48% 60%,#D9AE49 60% 72%,#FFF1BF 72% 85%,#CFA23C 85% 100%) 0 0/230% 100%}
.card[data-r=legende] .face{background-position:0 0,calc(var(--px) * 1%) 0}
.card[data-r=legende] .gloss::before{content:"";position:absolute;inset:0;mix-blend-mode:overlay;opacity:.9;
  background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.95) 49%,rgba(255,236,170,.4) 54%,transparent 62%) 0 0/300% 100%;
  animation:balaie 5.5s cubic-bezier(.45,0,.2,1) infinite}
.card[data-r=legende] .gloss::after{content:"";position:absolute;inset:0;mix-blend-mode:color-dodge;opacity:.18;
  background:repeating-linear-gradient(105deg,rgba(255,150,60,.6) 0 1px,rgba(255,235,120,.6) 1px 2px,transparent 2px 9px);
  background-position:calc(var(--px) * 1px) 0}
@keyframes balaie{0%{background-position:110% 0}60%,100%{background-position:-30% 0}}
@media (prefers-reduced-motion:reduce){
  .card{transition:none;transform:none}
  .fishwrap,.cursor .tab{transform:none}
  .card[data-r=legende] .gloss::before{animation:none;background-position:30% 0}
}


body{width:1600px;height:900px;overflow:hidden;position:relative}
h1{position:absolute;left:24px;top:30px;font:700 28px/1.1 var(--disp);letter-spacing:-.01em}
.sub{position:absolute;right:24px;top:38px;font-size:12px;color:var(--ink-2);text-align:right;line-height:1.5}
.row{position:absolute;left:28px;top:112px;display:grid;grid-template-columns:repeat(4,361px);gap:32px}
.col .stage{margin-bottom:22px}
.cap{display:grid;grid-template-columns:32px 1fr;column-gap:10px;align-items:start;width:361px}
.cap svg{width:32px;height:32px;color:var(--ink);grid-row:1/3}
.cap h2{font:700 18px/1.2 var(--disp)}
.cap p{font-size:12px;line-height:1.45;color:var(--ink-2);margin-top:3px}
.mini{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);position:absolute;left:24px;bottom:22px}
.mini svg{width:13px;height:13px;color:var(--ink)}

</style>

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
 <defs>
  <mask id="mk-plomb" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24"><rect width="24" height="24" fill="#fff"/><path d="M19 7.2L13.6 11.4" stroke="#000" stroke-width="1.9" stroke-linecap="round"/></mask>
  <clipPath id="cp-bouchon"><rect x="0" y="0" width="24" height="13.4"/></clipPath>
 </defs>
 <symbol id="plomb" viewBox="0 0 24 24"><circle cx="12" cy="12.5" r="8" fill="currentColor" mask="url(#mk-plomb)"/></symbol>
 <symbol id="bouchon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">

  <path d="M12 5.6C15.8 8.6 16.8 12.6 15.2 16C14.4 17.7 13.3 18.8 12 19.4C10.7 18.8 9.6 17.7 8.8 16C7.2 12.6 8.2 8.6 12 5.6Z" fill="currentColor" clip-path="url(#cp-bouchon)"/>
  <path d="M12 19.4V22.4"/></symbol>
 <symbol id="cuiller" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <g transform="rotate(28 12 12)"><circle cx="12" cy="3.4" r="1.7"/><path d="M12 5.1C16.6 7.2 18 12.5 16.2 17C15.2 19.4 13.7 20.6 12 21C10.3 20.6 8.8 19.4 7.8 17C6 12.5 7.4 7.2 12 5.1Z"/><ellipse cx="12" cy="14.2" rx="2" ry="4" fill="currentColor" stroke="none"/><circle cx="12" cy="8.6" r=".9" fill="currentColor" stroke="none"/></g></symbol>
 <symbol id="mouche" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">

<h1>La toise en quatre matières</h1>
<p class="sub">Même carte, même mesure. Le palier se lit à la forme du pictogramme et à la matière.<br>Passe le pointeur sur une carte pour l'incliner.</p>
<div class="row" id="row"></div>
<p class="mini">À 13 px :
 <svg><use href="#plomb"/></svg>plomb
 <svg><use href="#bouchon"/></svg>bouchon
 <svg><use href="#cuiller"/></svg>cuiller
 <svg><use href="#mouche"/></svg>mouche</p>
<script>
const NS='http://www.w3.org/2000/svg';
const CW=361,CH=552,BUTT=84,LPX=360,RAILX=16;
/* géométrie des illustrations : cadre alpha mesuré (px) */
const FISH={
 brochet:{w:1400,h:417,x0:6,x1:1394,y0:6,y1:412},
 gardon:{w:1400,h:720,x0:6,x1:1395,y0:6,y1:715},
 sandre:{w:1400,h:582,x0:6,x1:1395,y0:6,y1:577},
 'truite-fario':{w:1400,h:596,x0:5,x1:1395,y0:5,y1:591}};
function sv(n,a,p){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
function h(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.innerHTML=x;return e}

function makeCard(d){
  const g=FISH[d.fish],k=LPX/d.len,M=Math.floor(384/k),s=LPX/(g.x1-g.x0),out=d.out||12;
  const Y0=BUTT,yc=c=>Y0+c*k;
  const card=h('article','card');card.dataset.r=d.r;
  card.setAttribute('aria-label',`Carte : ${d.nom}, ${d.len} centimètres, ${d.rname}, numéro ${d.no.replace('/',' sur ')}`);
  const face=h('div','face');card.appendChild(face);
  face.appendChild(h('div','butt'));face.appendChild(h('div','lip'));
  /* toise : graduations gravées, cran de taille mini */
  const R=sv('svg',{class:'rail',viewBox:`0 0 ${CW} ${CH}`,'aria-hidden':'true'});face.appendChild(R);
  const step=M>40?10:5;
  for(let c=0;c<=M;c++){
    const len=c%10===0?24:c%5===0?15:8,y=yc(c);
    sv('path',{d:`M${RAILX} ${y}h${len}`,stroke:'var(--tickhi)','stroke-width':1,transform:'translate(0 1)'},R);
    sv('path',{d:`M${RAILX} ${y}h${len}`,stroke:'var(--tick)','stroke-width':c%10===0?1.4:1,opacity:c%10===0?1:.8},R);
    if(c%step===0&&c!==d.mini){const t=sv('text',{x:RAILX+30,y:y+4},R);t.textContent=c}
  }
  if(d.mini){
    const y=yc(d.mini);
    sv('path',{d:`M112 ${y}H190`,stroke:'var(--tick)','stroke-width':1.6},R);
    const t=sv('text',{x:RAILX+30,y:y+4,style:'font-weight:600'},R);t.textContent=d.mini+' mini';
    sv('path',{d:`M0 ${y-7}L9 ${y}L0 ${y+7}Z`,fill:'var(--page)'},R);
  }
  for(let c=10;c<=M;c+=10){sv('path',{d:`M78 ${yc(c)}H${CW}`,stroke:'var(--tick)','stroke-width':1,opacity:.13},R)}
  face.appendChild(h('div','plate'));
  /* le poisson : image tournée, museau à 0, queue sur la longueur */
  const wrap=h('div','fishwrap');card.appendChild(wrap);
  const Xt=CW+out-g.y1*s,Yt=Y0+g.x1*s,W=g.w*s,H=g.h*s;
  const place=(el,dx=0,dy=0)=>{el.style.width=W+'px';el.style.height=H+'px';el.style.transform=`translate(${Xt+dx}px,${Yt+dy}px) rotate(-90deg)`};
  const rim=h('img','rim');rim.src='../assets/fish/'+d.fish+'.png';rim.alt='';place(rim,-1.5,-1);wrap.appendChild(rim);
  const img=h('img');img.src='../assets/fish/'+d.fish+'.png';img.alt=d.nom+', '+d.len+' cm';place(img);wrap.appendChild(img);
  if(d.r==='peu'){const n=h('div','nacre');place(n);n.style.webkitMaskImage=n.style.maskImage=`url(${d.mask})`;n.style.webkitMaskSize=n.style.maskSize='100% 100%';wrap.appendChild(n)}
  /* le curseur passe devant le poisson */
  const cur=h('div','cursor');cur.style.top=yc(d.len)+'px';
  cur.innerHTML='<i class="line"></i><i class="glint"></i><span class="tab"><b class="tabn">'+d.len+'</b></span>';
  card.appendChild(cur);
  card.insertAdjacentHTML('beforeend',
   `<h2 class="nom">${d.nom}</h2><p class="lat">${d.latin}</p>
    <div class="taille"><span class="num">${d.len}</span><small>cm</small></div>
    <p class="info">${d.info}</p>
    <div class="foot"><svg role="img" aria-label="${d.rname}"><use href="#${d.sym}"/></svg><span>${d.foot}</span><span class="no">${d.no}</span></div>
    <div class="gloss"></div>`);
  card._cur=cur;card._yL=yc(d.len)-Y0;
  return card;
}
/* reflet piloté par le pointeur : variables CSS (méthode simeydotme, code réécrit) */
function tilt(card,zone){
  if(card.dataset.r==='commun'||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const set=(x,y)=>{card.style.setProperty('--px',x.toFixed(1));card.style.setProperty('--py',y.toFixed(1))};
  zone.addEventListener('pointermove',e=>{if(card._lock)return;const r=zone.getBoundingClientRect();
    set(Math.min(100,Math.max(0,(e.clientX-r.left)/r.width*100)),Math.min(100,Math.max(0,(e.clientY-r.top)/r.height*100)))});
  zone.addEventListener('pointerleave',()=>{if(!card._lock)set(62,38)});
