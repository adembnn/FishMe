<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=393, initial-scale=1, viewport-fit=cover">
<title>Carte des spots</title>
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<link rel="stylesheet" href="../../assets/vendor/phosphor/regular/style.css">
<style>
:root{
  --paper:#FFFFFF;--ink:#14181B;--ink-2:#4F575D;--hair:#C9CED2;--accent:#1E7F4F;
  --sans:'Hanken Grotesk',system-ui,sans-serif;--disp:'Bricolage Grotesque','Hanken Grotesk',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;--ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#E9EBEC}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;display:flex;justify-content:center}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.screen{position:relative;width:393px;height:852px;overflow:hidden;background:var(--paper)}
.island{position:absolute;top:11px;left:50%;width:124px;height:36px;margin-left:-62px;background:#000;border-radius:20px;z-index:30}
.status{position:absolute;top:0;left:0;right:0;height:54px;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:6px 34px 0 50px;font:600 17px/1 -apple-system,"SF Pro Text",var(--sans);letter-spacing:-.01em}
.status .r{display:flex;gap:6px;align-items:center}
.home{position:absolute;bottom:8px;left:50%;width:136px;height:5px;margin-left:-68px;border-radius:3px;background:#0B0F14;z-index:30}
.glass{background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);border:.5px solid rgba(20,24,27,.10);box-shadow:0 6px 20px rgba(20,24,27,.10)}
.bar{position:absolute;left:16px;right:16px;bottom:27px;height:62px;border-radius:31px;padding:6px;display:flex;gap:6px;z-index:15}
.btn{height:50px;border-radius:25px;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .25s var(--ease),filter .25s}
.btn i{font-size:20px}
.btn:active{transform:scale(.97)}
.main{flex:1;background:var(--accent);color:#fff}
.main:hover{filter:brightness(1.08)}
.sec{width:128px;color:var(--ink)}
.sec:hover{background:rgba(20,24,27,.05)}
.round{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;font-size:20px;color:var(--ink)}
.slot{display:inline-block;padding:4px 10px;border:1px dashed #9AA2A8;border-radius:6px;color:#6B7379;font-size:12px;font-family:var(--mono)}
.pips{display:inline-flex;gap:3px;vertical-align:middle}
.pips b{width:6px;height:6px;border-radius:3px;border:1px solid var(--ink-2);display:block}
.pips b.on{background:var(--ink);border-color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.map{position:absolute;inset:0;z-index:0}
.chips{position:absolute;top:60px;left:16px;right:16px;z-index:12;display:flex;gap:6px}
.chip{height:36px;padding:0 12px;border-radius:18px;font-size:13px;font-weight:600;display:flex;align-items:center}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.where{position:absolute;left:16px;top:106px;z-index:12;height:30px;padding:0 12px;border-radius:15px;font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.where i{font-size:14px}
.pin{position:absolute;z-index:6;border-radius:4px;background:#17403F;color:#fff;border:1px solid #E4ECE9;box-shadow:0 2px 4px rgba(20,24,27,.25);display:grid;place-items:center;font:700 13px/1 var(--disp)}
.pin.sel{border-radius:6px;font-size:18px;box-shadow:0 8px 14px rgba(20,24,27,.32),0 0 0 1px rgba(23,64,63,.2)}
.loc{position:absolute;right:16px;bottom:175px;z-index:12;width:48px;height:48px;border-radius:24px;display:grid;place-items:center;font-size:22px}
.fiche{position:absolute;left:16px;right:16px;bottom:101px;height:62px;border-radius:31px;padding:6px;display:flex;gap:6px;z-index:15}
.info{flex:1;padding:0 12px 0 14px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.info b{font:700 16px/1.15 var(--disp)}
.info span{font-size:12px;color:var(--ink-2);line-height:1.3}
.fiche .main{flex:none;width:136px}
.tabs{position:absolute;left:16px;bottom:27px;width:289px;height:62px;border-radius:31px;padding:6px;display:flex;z-index:15}
.tab{flex:1;border-radius:25px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;font-weight:600;line-height:14px;color:var(--ink-2);text-decoration:none}
.tab i{font-size:22px;line-height:24px}
.tab.on{background:rgba(20,24,27,.07);color:var(--accent)}
.go{position:absolute;right:16px;bottom:27px;width:62px;height:62px;border-radius:31px;background:var(--accent);color:#fff;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:600;line-height:14px;box-shadow:0 6px 20px rgba(20,24,27,.18)}

</style>
</head>
