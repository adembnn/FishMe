<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=393, initial-scale=1, viewport-fit=cover">
<title>Photo de la prise</title>
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<link rel="stylesheet" href="../../assets/vendor/phosphor/regular/style.css">
<link rel="stylesheet" href="../../assets/vendor/phosphor/fill/style.css">
<style>
:root{--paper:#FFFFFF;--ink:#14181B;--ink-2:#4F575D;--hair:#C9CED2;--accent:#1E7F4F;--red:#B3261E;--water:#17403F;
  --sans:'Hanken Grotesk',system-ui,sans-serif;--disp:'Bricolage Grotesque','Hanken Grotesk',sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#E9EBEC}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;display:flex;justify-content:center}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.screen{position:relative;width:393px;height:852px;overflow:hidden;background:var(--paper)}
.island{position:absolute;top:11px;left:50%;width:124px;height:36px;margin-left:-62px;background:#000;border-radius:20px;z-index:30}
.status{position:absolute;top:0;left:0;right:0;height:54px;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:6px 34px 0 50px;font:600 17px/1 -apple-system,"SF Pro Text",var(--sans);letter-spacing:-.01em;color:#0B0F14}
.status .r{display:flex;gap:6px;align-items:center}
.home{position:absolute;bottom:8px;left:50%;width:136px;height:5px;margin-left:-68px;border-radius:3px;background:#0B0F14;z-index:30}
.bar{position:absolute;left:16px;right:16px;bottom:27px;height:62px;border-radius:31px;padding:6px;display:flex;gap:6px;z-index:15;
  background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);
  border:.5px solid rgba(20,24,27,.10);box-shadow:0 6px 20px rgba(20,24,27,.10)}
.btn{height:50px;border-radius:25px;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .25s var(--ease),filter .25s}
.btn i{font-size:20px}
.btn:active{transform:scale(.97)}
.main{flex:1;background:var(--accent);color:#fff}
.sec{width:128px;color:var(--ink)}
.cap{font-size:12px;line-height:16px;color:var(--ink-2)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.screen{background:#0C1514}
.status{color:#fff}
.vf{position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 45%,#1F3532 0%,#0C1514 70%)}
.vf img{position:absolute;left:26px;top:350px;width:341px;transform:rotate(-5deg);filter:drop-shadow(0 18px 18px rgba(0,0,0,.55))}
.fr{position:absolute;left:36px;right:36px;top:244px;height:340px}
.fr i{position:absolute;width:30px;height:30px;border:2.5px solid rgba(255,255,255,.85)}
.fr i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-radius:10px 0 0 0}
.fr i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-radius:0 10px 0 0}
.fr i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 10px}
.fr i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 10px 0}
.close{position:absolute;left:16px;top:66px;width:44px;height:44px;border-radius:22px;display:grid;place-items:center;color:#fff;font-size:22px;background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.tm{position:absolute;right:16px;top:66px;height:44px;padding:0 16px 0 14px;border-radius:22px;display:flex;align-items:center;gap:8px;color:#fff;font-size:15px;font-weight:600;background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.tm b{font-weight:600;font-variant-numeric:tabular-nums;color:#7BE0AE}
.tip{position:absolute;left:36px;right:36px;top:604px;text-align:center;font-size:15px;line-height:22px;color:#E4ECE9}
.shut{position:absolute;left:50%;margin-left:-48px;bottom:84px;width:96px;height:96px}
.shut svg{position:absolute;inset:0;transform:rotate(-90deg)}
.shut b{position:absolute;inset:10px;border-radius:50%;background:#fff}
.lib{position:absolute;left:40px;bottom:100px;width:64px;height:64px;border-radius:14px;display:grid;place-items:center;color:#fff;font-size:26px;background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.libc{position:absolute;left:24px;width:96px;text-align:center;bottom:68px;font-size:12px;line-height:16px;color:#C5D2CE}

</style>
</head>
<body>
<main class="screen">
  <div class="island"></div>
  <div class="status" aria-hidden="true">
    <span>17:43</span>
    <span class="r">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M1.2 4.3a10 10 0 0 1 14.6 0"/><path d="M3.9 7.1a6 6 0 0 1 9.2 0"/><circle cx="8.5" cy="10.2" r=".9" fill="currentColor"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.8" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2.4" fill="currentColor"/><path d="M25 4.5v4c.8-.3 1.5-1.1 1.5-2s-.7-1.7-1.5-2z" fill="currentColor" opacity=".45"/></svg>
    </span>
  </div>

  <div class="vf"><img src="../../assets/fish/brochet.png" alt="Brochet tenu à plat (photo d'exemple)"></div>
  <div class="fr" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <button class="close" aria-label="Annuler"><i class="ph ph-x"></i></button>
  <div class="tm" role="timer" aria-label="7 secondes restantes hors de l'eau"><i class="ph ph-timer" aria-hidden="true"></i>Hors de l'eau <b>7&nbsp;s</b></div>
  <p class="tip">Poisson à plat dans le cadre, mains mouillées.</p>
  <button class="lib" aria-label="Choisir dans la photothèque"><i class="ph ph-image"></i></button>
  <div class="shut"><svg viewBox="0 0 96 96" aria-hidden="true"><circle cx="48" cy="48" r="45" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="4"/><circle cx="48" cy="48" r="45" fill="none" stroke="#7BE0AE" stroke-width="4" stroke-linecap="round" stroke-dasharray="282.7" stroke-dashoffset="84.8"/></svg><b></b></div>
  <div class="home" style="background:#fff"></div>
</main>
</body>
</html>
