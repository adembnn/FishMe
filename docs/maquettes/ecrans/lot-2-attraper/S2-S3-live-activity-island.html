<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=393, initial-scale=1, viewport-fit=cover">
<title>Live Activity et Dynamic Island</title>
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<link rel="stylesheet" href="../../assets/vendor/phosphor/regular/style.css">
<link rel="stylesheet" href="../../assets/vendor/phosphor/fill/style.css">
<style>
:root{--paper:#FFFFFF;--ink:#14181B;--ink-2:#4F575D;--hair:#C9CED2;--accent:#1E7F4F;--red:#B3261E;--water:#17403F;
  --sans:'Hanken Grotesk',system-ui,sans-serif;--disp:'Bricolage Grotesque','Hanken Grotesk',sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#E9EBEC}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;display:flex;justify-content:center}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.screen{position:relative;width:393px;height:852px;overflow:hidden;background:var(--paper)}
.island{position:absolute;top:11px;left:50%;width:124px;height:36px;margin-left:-62px;background:#000;border-radius:20px;z-index:30}
.status{position:absolute;top:0;left:0;right:0;height:54px;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:6px 34px 0 50px;font:600 17px/1 -apple-system,"SF Pro Text",var(--sans);letter-spacing:-.01em;color:#0B0F14}
.status .r{display:flex;gap:6px;align-items:center}
.home{position:absolute;bottom:8px;left:50%;width:136px;height:5px;margin-left:-68px;border-radius:3px;background:#0B0F14;z-index:30}
.bar{position:absolute;left:16px;right:16px;bottom:27px;height:62px;border-radius:31px;padding:6px;display:flex;gap:6px;z-index:15;
  background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);
  border:.5px solid rgba(20,24,27,.10);box-shadow:0 6px 20px rgba(20,24,27,.10)}
.btn{height:50px;border-radius:25px;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .25s var(--ease),filter .25s}
.btn i{font-size:20px}
.btn:active{transform:scale(.97)}
.main{flex:1;background:var(--accent);color:#fff}
.sec{width:128px;color:var(--ink)}
.cap{font-size:12px;line-height:16px;color:var(--ink-2)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.screen{background:#EEF1F0}
.sec-a{position:absolute;left:0;right:0;top:0;height:330px;background:#F4F6F5}
.sec-b{position:absolute;left:0;right:0;top:330px;bottom:0;background:var(--water);color:#F3F5EF}
.lab{position:absolute;left:16px;font:600 12px/16px var(--mono);letter-spacing:.04em;color:var(--ink-2)}
.sec-b .lab{color:#B9CCC6}
.exp{position:absolute;top:11px;left:11px;right:11px;height:158px;border-radius:44px;background:#000;color:#fff;z-index:31;padding:16px 26px 16px}
.exp .head{display:flex;justify-content:space-between;align-items:flex-start;margin-top:30px}
.exp .k{font-size:12px;line-height:16px;color:#A9B3B0}
.exp .v{font-family:var(--disp);font-weight:700;font-size:34px;line-height:36px;letter-spacing:-.02em}
.exp .v small{font-size:16px;font-weight:600;margin:0 4px 0 1px}
.exp .r{text-align:right}
.exp .btnx{position:absolute;left:22px;right:22px;bottom:14px;height:42px;border-radius:21px;background:var(--accent);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:15px}
.exp .btnx i{font-size:20px}
.pill{position:absolute;background:#000;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 14px}
.pill .f{color:#5FD19A;font-size:20px}
.pill .t{font-family:var(--disp);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
.date{position:absolute;left:0;right:0;top:372px;text-align:center;font-size:15px;font-weight:600;color:#D9E3DD}
.time{position:absolute;left:0;right:0;top:394px;text-align:center;font-family:var(--disp);font-weight:700;font-size:84px;line-height:1;letter-spacing:-.03em;color:#F3F5EF}
.la{color:#F3F5EF;position:absolute;left:16px;right:16px;top:510px;border-radius:24px;padding:16px;background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);border:.5px solid rgba(255,255,255,.22)}
.la .h{display:flex;align-items:center;gap:8px;font-size:12px;line-height:16px;color:#D9E3DD}
.la .h i{font-size:18px;color:#7BE0AE}
.la .m{display:flex;justify-content:space-between;align-items:flex-end;margin-top:8px}
.la .v{font-family:var(--disp);font-weight:700;font-size:38px;line-height:40px;letter-spacing:-.02em}
.la .v small{font-size:17px;font-weight:600;margin:0 6px 0 2px}
.la .to{font-size:12px;line-height:16px;color:#D9E3DD;text-align:right}
.la .g{height:4px;border-radius:2px;background:rgba(255,255,255,.2);margin-top:12px;position:relative}
.la .g i{position:absolute;left:0;top:0;bottom:0;width:27%;background:#fff;border-radius:2px}
.la .go{margin-top:14px;height:44px;border-radius:22px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:15px}
.la .go i{font-size:20px}
.qk{position:absolute;bottom:44px;width:50px;height:50px;border-radius:25px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:22px;color:#F3F5EF}
.status{color:#fff}

</style>
</head>
<body>
<main class="screen">
  <div class="island"></div>
  <div class="status" aria-hidden="true">
    <span>17:42</span>
    <span class="r">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M1.2 4.3a10 10 0 0 1 14.6 0"/><path d="M3.9 7.1a6 6 0 0 1 9.2 0"/><circle cx="8.5" cy="10.2" r=".9" fill="currentColor"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.8" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2.4" fill="currentColor"/><path d="M25 4.5v4c.8-.3 1.5-1.1 1.5-2s-.7-1.7-1.5-2z" fill="currentColor" opacity=".45"/></svg>
    </span>
  </div>

  <div class="sec-a"></div><div class="sec-b"></div>
  <section class="exp" aria-label="Dynamic Island étendue">
    <div class="head">
      <div><p class="k">Fin légale dans</p><p class="v">1&nbsp;h&nbsp;12</p></div>
      <div class="r"><p class="k">La Marne (94)</p><p class="v">0<small> prise</small></p></div>
    </div>
    <div class="btnx"><i class="ph-fill ph-fish"></i>J'ai une prise</div>
  </section>
  <p class="lab" style="top:186px">DYNAMIC ISLAND · ÉTENDUE (appui long)</p>
  <p class="lab" style="top:222px">COMPACTE</p>
  <div class="pill" style="left:16px;top:244px;width:232px;height:37px;border-radius:19px"><i class="ph-fill ph-fish f" aria-hidden="true"></i><span class="t">1&nbsp;h&nbsp;12</span></div>
  <p class="lab" style="left:264px;top:222px">MINIMALE</p>
  <div class="pill" style="left:264px;top:244px;width:37px;height:37px;border-radius:19px;justify-content:center;padding:0"><i class="ph-fill ph-fish f" aria-hidden="true"></i></div>
  <p class="lab" style="top:346px;color:#B9CCC6">ÉCRAN VERROUILLÉ</p>
  <p class="date">Lundi 12 octobre</p>
  <p class="time">17:42</p>
  <section class="la" aria-label="Live Activity">
    <div class="h"><i class="ph-fill ph-fish" aria-hidden="true"></i>Sortie en cours · La Marne, Val-de-Marne (94)</div>
    <div class="m"><p class="v">1&nbsp;h&nbsp;12</p><p class="to">avant la fin légale<br>à 18 h 54</p></div>
    <div class="g" aria-hidden="true"><i></i></div>
    <div class="go"><i class="ph-fill ph-fish"></i>J'ai une prise</div>
  </section>
  <div class="qk" style="left:44px"><i class="ph ph-flashlight"></i></div>
  <div class="qk" style="right:44px"><i class="ph ph-camera"></i></div>
  <div class="home" style="background:#fff"></div>
</main>
</body>
</html>
