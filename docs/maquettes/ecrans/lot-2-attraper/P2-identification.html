<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=393, initial-scale=1, viewport-fit=cover">
<title>Identification de la prise</title>
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<link rel="stylesheet" href="../../assets/vendor/phosphor/regular/style.css">
<link rel="stylesheet" href="../../assets/vendor/phosphor/fill/style.css">
<style>
:root{--paper:#FFFFFF;--ink:#14181B;--ink-2:#4F575D;--hair:#C9CED2;--accent:#1E7F4F;--red:#B3261E;--water:#17403F;
  --sans:'Hanken Grotesk',system-ui,sans-serif;--disp:'Bricolage Grotesque','Hanken Grotesk',sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#E9EBEC}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;display:flex;justify-content:center}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.screen{position:relative;width:393px;height:852px;overflow:hidden;background:var(--paper)}
.island{position:absolute;top:11px;left:50%;width:124px;height:36px;margin-left:-62px;background:#000;border-radius:20px;z-index:30}
.status{position:absolute;top:0;left:0;right:0;height:54px;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:6px 34px 0 50px;font:600 17px/1 -apple-system,"SF Pro Text",var(--sans);letter-spacing:-.01em;color:#0B0F14}
.status .r{display:flex;gap:6px;align-items:center}
.home{position:absolute;bottom:8px;left:50%;width:136px;height:5px;margin-left:-68px;border-radius:3px;background:#0B0F14;z-index:30}
.bar{position:absolute;left:16px;right:16px;bottom:27px;height:62px;border-radius:31px;padding:6px;display:flex;gap:6px;z-index:15;
  background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);
  border:.5px solid rgba(20,24,27,.10);box-shadow:0 6px 20px rgba(20,24,27,.10)}
.btn{height:50px;border-radius:25px;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .25s var(--ease),filter .25s}
.btn i{font-size:20px}
.btn:active{transform:scale(.97)}
.main{flex:1;background:var(--accent);color:#fff}
.sec{width:128px;color:var(--ink)}
.cap{font-size:12px;line-height:16px;color:var(--ink-2)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.hd{position:absolute;left:16px;right:16px;top:70px;display:flex;gap:14px;align-items:center}
.thumb{width:92px;height:68px;border-radius:12px;background:radial-gradient(120% 120% at 50% 40%,#2B4A46,#10201F);position:relative;overflow:hidden;flex:none}
.thumb img{position:absolute;left:-6px;top:12px;width:104px;transform:rotate(-7deg)}
.hd h1{font-family:var(--disp);font-weight:700;font-size:34px;line-height:36px;letter-spacing:-.02em}
.hd p{margin-top:4px}
.list{position:absolute;left:16px;right:16px;top:196px}
.o{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:0 4px;height:64px;border-top:1px solid var(--hair)}
.o:last-child{border-bottom:1px solid var(--hair)}
.o .im{width:84px;height:44px;display:grid;place-items:center;flex:none}
.o .im img{max-width:84px;max-height:44px}
.o .nm{font-size:17px;font-weight:600;line-height:22px}
.o .la{font-size:12px;font-style:italic;color:var(--ink-2);line-height:16px}
.o .rad{margin-left:auto;width:24px;height:24px;border-radius:12px;border:1.5px solid var(--hair);flex:none}
.o.on{height:84px;background:#F2F8F4;border-top-color:var(--accent);border-top-width:2px;margin:0;width:calc(100% + 32px);margin-left:-16px;padding:0 20px}
.o.on .im{width:112px;height:60px}
.o.on .im img{max-width:112px;max-height:60px}
.o.on .nm{font-family:var(--disp);font-weight:700;font-size:24px;line-height:26px;letter-spacing:-.01em}
.o.on .rad{background:var(--accent);border-color:var(--accent);color:#fff;display:grid;place-items:center;font-size:16px}
.none{position:absolute;left:16px;right:16px;top:458px;height:44px;display:flex;align-items:center;gap:16px;font-size:15px;color:var(--ink-2)}.none a{color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}
.sz{position:absolute;left:16px;right:16px;top:530px}
.sz .t{display:flex;justify-content:space-between;align-items:baseline}
.sz .t span{font-size:15px;font-weight:600}
.sz .t b{font-family:var(--disp);font-weight:700;font-size:48px;line-height:48px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.sz .t b small{font-size:20px;font-weight:600;margin-left:3px;letter-spacing:0}
.trk{position:relative;height:44px;margin-top:10px}
.trk .l{position:absolute;left:0;right:0;top:20px;height:4px;border-radius:2px;background:#E3E6E8}
.trk .f{position:absolute;left:0;top:20px;height:4px;border-radius:2px;background:var(--ink);width:52.7%}
.trk .k{position:absolute;left:52.7%;top:6px;width:32px;height:32px;margin-left:-16px;border-radius:16px;background:#fff;border:.5px solid rgba(20,24,27,.18);box-shadow:0 2px 6px rgba(20,24,27,.22)}
.tk{display:flex;justify-content:space-between;margin-top:2px}
.bar .main{flex:1}

</style>
</head>
<body>
<main class="screen">
  <div class="island"></div>
  <div class="status" aria-hidden="true">
    <span>17:43</span>
    <span class="r">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M1.2 4.3a10 10 0 0 1 14.6 0"/><path d="M3.9 7.1a6 6 0 0 1 9.2 0"/><circle cx="8.5" cy="10.2" r=".9" fill="currentColor"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.8" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2.4" fill="currentColor"/><path d="M25 4.5v4c.8-.3 1.5-1.1 1.5-2s-.7-1.7-1.5-2z" fill="currentColor" opacity=".45"/></svg>
    </span>
  </div>

  <header class="hd"><div class="thumb"><img src="../../assets/fish/brochet.png" alt="" ></div><div><h1>C'est quel poisson ?</h1><p class="cap">Propositions de l'iPhone, sans réseau. Tu confirmes.</p></div></header>
  <div class="list" role="radiogroup" aria-label="Espèces proposées">
    <button class="o on" role="radio" aria-checked="true"><span class="im"><img src="../../assets/fish/brochet.png" alt=""></span><span><span class="nm" style="display:block">Brochet</span><span class="la">Esox lucius</span></span><span class="rad"><i class="ph ph-check"></i></span></button>
    <button class="o" role="radio" aria-checked="false"><span class="im"><img src="../../assets/fish/sandre.png" alt=""></span><span><span class="nm" style="display:block">Sandre</span><span class="la">Sander lucioperca</span></span><span class="rad"></span></button>
    <button class="o" role="radio" aria-checked="false"><span class="im"><img src="../../assets/fish/perche.png" alt=""></span><span><span class="nm" style="display:block">Perche</span><span class="la">Perca fluviatilis</span></span><span class="rad"></span></button>
  </div>
  <div class="none"><a href="#">Aucune de ces espèces</a><a href="#">Pas un poisson</a></div>
  <section class="sz" aria-label="Taille">
    <div class="t"><span>Taille, à peu près</span><b>68<small>cm</small></b></div>
    <div class="trk"><div class="l"></div><div class="f"></div><div class="k" role="slider" aria-valuemin="10" aria-valuemax="120" aria-valuenow="68" aria-label="Taille en centimètres" tabindex="0"></div></div>
    <div class="tk cap mono"><span>10 cm</span><span>120 cm</span></div>
  </section>
  <div class="bar"><button class="btn main">Voir ce que je peux faire<i class="ph ph-arrow-right"></i></button></div>
  <div class="home" ></div>
</main>
</body>
</html>
