<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=393, initial-scale=1, viewport-fit=cover">
<title>Sortie en cours</title>
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<link rel="stylesheet" href="../../assets/vendor/phosphor/regular/style.css">
<link rel="stylesheet" href="../../assets/vendor/phosphor/fill/style.css">
<style>
:root{--paper:#FFFFFF;--ink:#14181B;--ink-2:#4F575D;--hair:#C9CED2;--accent:#1E7F4F;--red:#B3261E;--water:#17403F;
  --sans:'Hanken Grotesk',system-ui,sans-serif;--disp:'Bricolage Grotesque','Hanken Grotesk',sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#E9EBEC}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;display:flex;justify-content:center}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.screen{position:relative;width:393px;height:852px;overflow:hidden;background:var(--paper)}
.island{position:absolute;top:11px;left:50%;width:124px;height:36px;margin-left:-62px;background:#000;border-radius:20px;z-index:30}
.status{position:absolute;top:0;left:0;right:0;height:54px;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:6px 34px 0 50px;font:600 17px/1 -apple-system,"SF Pro Text",var(--sans);letter-spacing:-.01em;color:#0B0F14}
.status .r{display:flex;gap:6px;align-items:center}
.home{position:absolute;bottom:8px;left:50%;width:136px;height:5px;margin-left:-68px;border-radius:3px;background:#0B0F14;z-index:30}
.bar{position:absolute;left:16px;right:16px;bottom:27px;height:62px;border-radius:31px;padding:6px;display:flex;gap:6px;z-index:15;
  background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);
  border:.5px solid rgba(20,24,27,.10);box-shadow:0 6px 20px rgba(20,24,27,.10)}
.btn{height:50px;border-radius:25px;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .25s var(--ease),filter .25s}
.btn i{font-size:20px}
.btn:active{transform:scale(.97)}
.main{flex:1;background:var(--accent);color:#fff}
.sec{width:128px;color:var(--ink)}
.cap{font-size:12px;line-height:16px;color:var(--ink-2)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.top{position:absolute;left:16px;right:16px;top:76px}
.where{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600}
.where i{font-size:20px;color:var(--ink-2)}
.big{position:absolute;left:16px;right:16px;top:290px}
.big .lbl{font-size:15px;color:var(--ink-2);line-height:22px}
.big .n{font-family:var(--disp);font-weight:700;font-size:92px;line-height:1;letter-spacing:-.035em;margin:6px 0 10px -4px;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:4px}
.big .n small{font-size:34px}
.gauge{height:4px;border-radius:2px;background:#E3E6E8;margin-top:22px;position:relative}
.gauge i{position:absolute;left:0;top:0;bottom:0;width:27%;background:var(--ink);border-radius:2px}
.gauge b{position:absolute;left:27%;top:-4px;width:12px;height:12px;border-radius:6px;background:var(--ink);margin-left:-6px}
.row{display:flex;justify-content:space-between;margin-top:10px}
.chrono{position:absolute;left:16px;right:16px;top:440px;border-top:1px solid var(--hair);padding-top:14px;display:flex;justify-content:space-between;align-items:baseline}
.chrono .t{font-family:var(--mono);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.bar{height:84px;border-radius:42px;padding:8px;bottom:27px}
.bar .btn{height:68px;border-radius:34px}
.bar .main{font-size:17px;font-weight:600;gap:10px}
.bar .main i{font-size:26px}
.bar .sec{width:118px;font-size:17px;color:var(--ink)}

</style>
</head>
<body>
<main class="screen">
  <div class="island"></div>
  <div class="status" aria-hidden="true">
    <span>17:42</span>
    <span class="r">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M1.2 4.3a10 10 0 0 1 14.6 0"/><path d="M3.9 7.1a6 6 0 0 1 9.2 0"/><circle cx="8.5" cy="10.2" r=".9" fill="currentColor"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.8" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2.4" fill="currentColor"/><path d="M25 4.5v4c.8-.3 1.5-1.1 1.5-2s-.7-1.7-1.5-2z" fill="currentColor" opacity=".45"/></svg>
    </span>
  </div>

  <div class="top"><p class="where"><i class="ph ph-map-pin" aria-hidden="true"></i>La Marne, Val-de-Marne (94)</p></div>
  <section class="big" aria-label="Fin légale de pêche">
    <p class="lbl">Avant la fin légale de pêche</p>
    <p class="n" role="timer" aria-label="1 heure 12 minutes restantes">1&nbsp;h&nbsp;12</p>
    <div class="gauge" aria-hidden="true"><i></i><b></b></div>
    <p class="cap" style="margin-top:14px">0 prise · depuis 17&nbsp;h&nbsp;16</p>
  </section>
  <div class="bar">
    <button class="btn main"><i class="ph-fill ph-fish"></i>J'ai une prise</button>
    <button class="btn sec">Terminer</button>
  </div>
  <div class="home" ></div>
</main>
</body>
</html>
