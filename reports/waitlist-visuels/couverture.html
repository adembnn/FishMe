<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Couverture de la page d'attente</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Image de couverture 390 x 330, exportée en PNG par exporter.sh. La carte suit App/Collection/CarteRectoView.swift :
   largeur = 100 u, hauteur = 144,9 u (69/100), poisson 88 u de large à (8 u ; 22 % de la hauteur) tourné de -12°, plaque du bas 40 %. */
*{box-sizing:border-box;margin:0}
body{width:390px;height:330px;overflow:hidden;font-family:"Nunito",ui-rounded,system-ui,sans-serif;background:#082A4C;position:relative}
.anneaux{position:absolute;inset:0}
.marque{position:absolute;top:20px;left:20px;display:flex;align-items:center;gap:9px;z-index:9;font-weight:900;font-size:19px;color:#fff}
.marque img{width:30px;height:30px;border-radius:8px;display:block}

.carte{--u:1.68px;position:absolute;width:calc(var(--u)*100);height:calc(var(--u)*144.9);border-radius:calc(var(--u)*6);overflow:hidden;box-shadow:0 calc(var(--u)*4) calc(var(--u)*9) rgba(0,0,0,.38);outline:1px solid rgba(0,0,0,.1);outline-offset:-1px}
.recto{background:#17403F;color:#fff}
.recto .ondes{position:absolute;left:0;top:0;width:100%;height:100%}
.recto .vernis{position:absolute;inset:0;background:linear-gradient(118deg,transparent 38%,rgba(190,255,235,.22) 47%,transparent 56%)}
.recto .interieur{position:absolute;inset:calc(var(--u)*2.4);border:1px solid rgba(255,255,255,.28);border-radius:calc(var(--u)*4.4);z-index:3}
.recto .centile{position:absolute;left:calc(var(--u)*5.5);top:calc(var(--u)*4);font-size:calc(var(--u)*16);font-weight:900;line-height:.9;letter-spacing:-.04em;z-index:4}
.recto .centile sup{font-size:calc(var(--u)*7);letter-spacing:0;vertical-align:baseline;position:relative;top:calc(var(--u)*-6)}
.recto .legende{position:absolute;left:calc(var(--u)*5.5);top:calc(var(--u)*19.5);font-size:calc(var(--u)*3);font-weight:800;color:rgba(255,255,255,.85);white-space:nowrap;z-index:4}
.recto .poisson{position:absolute;left:calc(var(--u)*8);top:22%;width:calc(var(--u)*88);transform:rotate(-12deg);filter:drop-shadow(calc(var(--u)*-1.5) calc(var(--u)*2.5) calc(var(--u)*1) rgba(0,0,0,.35));z-index:2}
.recto .plaque{position:absolute;left:0;right:0;bottom:0;height:40%;background:#E9EDEB;clip-path:polygon(0 0,100% 7%,100% 100%,0 100%);color:#0F1A1C;padding:calc(var(--u)*6) calc(var(--u)*5.5) calc(var(--u)*4);display:flex;flex-direction:column;z-index:5}
.recto .nom{display:flex;align-items:baseline;gap:calc(var(--u)*2.4);padding-bottom:calc(var(--u)*3);border-bottom:1px solid rgba(15,26,28,.12)}
.recto .nom b{font-size:calc(var(--u)*8.4);font-weight:900;line-height:1}
.recto .nom em{font-size:calc(var(--u)*3.2);font-weight:700;color:#5B6A6E}
.recto .stats{display:flex;align-items:flex-end;margin-top:calc(var(--u)*2.8)}
.recto .col{flex:none}
.recto .col b{font-size:calc(var(--u)*7.4);font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.recto .col b small{font-size:calc(var(--u)*3.4);font-weight:700}
.recto .col span{display:block;margin-top:calc(var(--u)*1.4);font-size:calc(var(--u)*2.9);font-weight:800;letter-spacing:.06em;color:#5B6A6E;text-transform:uppercase}
.recto .palier{flex:none;margin-left:auto;text-align:center;font-size:calc(var(--u)*2.7);font-weight:900;letter-spacing:.05em;color:#23885A}
.recto .palier i{display:block;margin:0 auto calc(var(--u)*1.2);width:calc(var(--u)*8);height:calc(var(--u)*8);background:#23885A;clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%)}
.recto .lieu{margin-top:auto;font-size:calc(var(--u)*3.1);font-weight:700;color:#5B6A6E;white-space:nowrap;padding-bottom:calc(var(--u)*1.2)}
.recto .pied{display:flex;justify-content:space-between;font-size:calc(var(--u)*2.8);font-weight:700;color:#5B6A6E;white-space:nowrap}
.recto .pied b{color:#0F1A1C;font-weight:900}

.verso{background:#E9EDEB}
.verso img{position:absolute;left:50%;top:50%;width:calc(var(--u)*144.9);transform:translate(-50%,-50%) rotate(-90deg)}
.verso .interieur{position:absolute;inset:calc(var(--u)*2.4);border:1px solid rgba(255,255,255,.28);border-radius:calc(var(--u)*4.4)}

.retourne{position:absolute;left:178px;top:398px;width:34px;height:34px;border-radius:50%;background:#E7EFF8;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,.28);z-index:9}

.fond{position:absolute;inset:0;overflow:hidden}
.fond svg{position:absolute;inset:0}
</style>
</head>
<body>
<div class="fond" style="background:linear-gradient(180deg,rgba(8,42,76,.05) 0%,rgba(8,42,76,.55) 55%,rgba(8,42,76,.92) 100%),url(img/fond-eau.jpg) center 0/cover"></div>
<div class="marque"><img src="img/icone.png" alt="">FishMe</div>

<div class="carte verso" style="left:196px;top:54px;transform:rotate(7deg)">
  <img src="img/photo-brochet-cc0.jpg" alt="">
  <div class="interieur"></div>
</div>

<div class="carte recto" style="left:14px;top:68px;transform:rotate(-5deg)">
  <svg class="ondes" viewBox="0 0 100 144.9" preserveAspectRatio="none" aria-hidden="true">
    <g fill="none" stroke="#fff" stroke-opacity=".165" stroke-width=".5" vector-effect="non-scaling-stroke">
      <ellipse cx="74" cy="37.7" rx="14.5" ry="21"/><ellipse cx="74" cy="37.7" rx="29.5" ry="42.7"/><ellipse cx="74" cy="37.7" rx="44.5" ry="64.5"/><ellipse cx="74" cy="37.7" rx="59.5" ry="86.2"/><ellipse cx="74" cy="37.7" rx="74.5" ry="108"/><ellipse cx="74" cy="37.7" rx="89.5" ry="129.7"/>
    </g>
  </svg>
  <div class="vernis"></div>
  <div class="interieur"></div>
  <img class="poisson" src="img/brochet.png" alt="">
  <div class="plaque">
    <div class="nom"><b>Brochet</b><em>Esox lucius</em></div>
    <div class="stats">
      <div class="col"><b>68<small> cm</small></b><span>Taille</span></div>
      <div class="palier"><i></i>PEU COMMUN</div>
    </div>
    <div class="lieu">La Marne · 94 · 12 oct. 2026</div>
  </div>
</div>
</body>
</html>
